name: Build BF Training Academy APK

on:
  push:
    branches: [bf-training-academy-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleRelease -PrunNumber=${{ github.run_number }} --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/BF-Training-Academy-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BF-Training-Academy-apk
          path: out/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: bf-training-academy-v1.0.${{ github.run_number }}
          name: BF Training Academy v1.0.${{ github.run_number }} (test build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Test build of the Blast Furnace Training Academy Android app.
            Download the .apk below on your phone and install it (allow "Install unknown apps" for your browser).
            Signed with a test key — not for Play Store.
          files: out/*.apk
