name: Build BF Training Academy APK

on:
  push:
    branches: [bf-training-academy-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build APK
        id: build
        run: |
          set -o pipefail
          mkdir -p out
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" | tee out/build-log.txt
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>&1 | tee -a out/build-log.txt
          gradle :app:assembleRelease -PrunNumber=${{ github.run_number }} --no-daemon --stacktrace 2>&1 | tee -a out/build-log.txt
          cp app/build/outputs/apk/release/app-release.apk out/NK-Training-Academy-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BF-Training-Academy-build
          path: out/*

      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: bf-training-academy-v1.0.${{ github.run_number }}
          name: NK Training Academy v1.0.${{ github.run_number }} (test build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Test build of the NK Plant Training Academy (blast furnace, sinter, coke oven, pellet, lime, oxygen plants).
            Download the .apk below on your phone and install it (allow "Install unknown apps" for your browser).
            Signed with a test key — not for Play Store. build-log.txt is the build output.
          files: out/*
