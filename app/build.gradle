plugins {
    id 'com.android.application'
}

def runNumber = (project.findProperty('runNumber') ?: '1').toString().toInteger()

android {
    namespace 'com.nk.bftrainingacademy'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nk.bftrainingacademy'
        minSdk 21
        targetSdk 34
        versionCode runNumber
        versionName "1.0." + runNumber
    }

    signingConfigs {
        test {
            storeFile file('test-signing.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.test
        }
        debug {
            signingConfig signingConfigs.test
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
