<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a45">
<title>NK Exam Portal</title>
<style>
:root{--ink:#0b1f33;--ink2:#3d5166;--mut:#6b7c8f;--line:#dbe3ec;--bg:#f2f5f9;--card:#fff;--pri:#0b5c8e;--pri2:#084a73;--acc:#0fa3a3;--ok:#13804b;--okbg:#e6f5ec;--bad:#c0362c;--badbg:#fdecea;--warn:#b26a00;--warnbg:#fff4e0;--rev:#6c3fc4;--rad:12px;--sh:0 1px 2px rgba(11,31,51,.06),0 4px 14px rgba(11,31,51,.06)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
a{color:var(--pri)}
code,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
code{background:#eef2f6;padding:1px 5px;border-radius:4px;font-size:.92em}
pre{background:#eef2f6;padding:10px;border-radius:8px;white-space:pre-wrap;font-size:13px}
h1,h2,h3,h4{margin:.2em 0 .5em;line-height:1.25}
h2{font-size:1.3rem}h3{font-size:1.08rem}
.h1{font-size:1.45rem;margin:.1em 0 .3em}
.muted{color:var(--mut)}.small{font-size:.86rem}.center{text-align:center}
.mt{margin-top:14px}.mt2{margin-top:24px}.mt-s{margin-top:6px}
.row{display:flex;align-items:center;flex-wrap:wrap}.gap{gap:8px}.wrapr{flex-wrap:wrap}
.rowb{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:10px 0}
.sp{flex:1}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:linear-gradient(90deg,#0b2a45,#0b5c8e);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.top .btn.ghost{color:#fff;border-color:rgba(255,255,255,.45);background:transparent}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;min-width:0}
.logo{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;background:#fff;color:#0b5c8e;font-weight:800;letter-spacing:-.5px;flex:none;font-size:15px;box-shadow:inset 0 0 0 2px #0fa3a3}
.bt{display:flex;flex-direction:column;min-width:0}.bt b{font-size:1rem}.org{font-size:.75rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.who{display:flex;align-items:center;gap:10px}.who span{display:flex;flex-direction:column;text-align:right;font-size:.88rem}.who small{opacity:.8}
.anav{display:flex;gap:2px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 10px;position:sticky;top:56px;z-index:19}
.anav a{padding:12px 14px;text-decoration:none;color:var(--ink2);white-space:nowrap;border-bottom:3px solid transparent;font-weight:500}
.anav a.on{color:var(--pri);border-color:var(--pri)}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.wrap.narrow{max-width:680px}
.foot{text-align:center;color:var(--mut);font-size:.8rem;padding:24px 10px 30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:18px;margin:12px 0;box-shadow:var(--sh)}
.card.soft{background:#f8fafc;box-shadow:none}
.card.notice{border-left:4px solid var(--pri)}
.card.warn{border-left:4px solid var(--warn);background:var(--warnbg)}
.hero{text-align:center;padding:18px 6px 4px}.hero h1{font-size:1.8rem;margin:0}.hero p{color:var(--ink2);margin:.4em 0 0}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);font-weight:700}
.lbl{display:block;font-weight:600;font-size:.88rem;margin:12px 0 5px;color:var(--ink2)}
.inp{width:100%;padding:10px 12px;border:1px solid #c5d1dd;border-radius:9px;font:inherit;background:#fff;color:var(--ink)}
.inp:focus{outline:2px solid rgba(11,92,142,.25);border-color:var(--pri)}
.inp.big{font-size:1.25rem;padding:13px 14px;letter-spacing:.08em;text-transform:uppercase}
.inp.sm{width:auto;padding:6px 8px;font-size:.88rem}.inp.xs{width:70px;padding:4px 6px;font-size:.85rem;display:inline-block}
textarea.inp{resize:vertical}
select.inp{width:auto;max-width:100%}
.fld .inp,.fld select.inp{width:100%}
.hint{font-size:.8rem;color:var(--mut);margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:9px;border:1px solid #c5d1dd;background:#fff;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--pri)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}.btn.primary:hover{background:var(--pri2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warnb{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.dangerl{color:var(--bad);border-color:#f0c3bf}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:.86rem}.btn.xs{padding:3px 8px;font-size:.8rem;border-radius:7px}
.btn.block{display:flex;width:100%}.btn.big{padding:14px;font-size:1.05rem}
label.btn{cursor:pointer}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.chk input{margin-top:3px;width:18px;height:18px}
.sw{display:flex;align-items:center;gap:10px;margin:10px 0;cursor:pointer;font-size:.93rem}
.sw input{display:none}
.sw span{position:relative;width:42px;height:24px;border-radius:12px;background:#c5d1dd;flex:none;transition:.2s}
.sw span:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--pri)}.sw input:checked+span:after{left:21px}
.sw input:disabled+span{opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid2>.card{margin:0}.grid2.tight{gap:10px}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.75rem;font-weight:700;vertical-align:middle;background:#e6ebf1;color:var(--ink2)}
.b-published,.b-submitted{background:var(--okbg);color:var(--ok)}.b-paused,.b-in-progress,.b-expired{background:var(--warnbg);color:var(--warn)}.b-closed,.b-voided{background:#ececec;color:#555}.b-draft{background:#e8eef8;color:#3b5a85}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:.78rem;font-weight:700;background:#eef2f6;color:var(--ink2)}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}
.c-ok{color:var(--ok)}.c-bad{color:var(--bad)}.c-warn{color:var(--warn)}.neg{color:var(--bad)}
.ok-box,.err-box,.warn-box{padding:10px 12px;border-radius:9px;font-size:.92rem}
.ok-box{background:var(--okbg);color:#0d5c36}.err-box{background:var(--badbg);color:#8d241c}.warn-box{background:var(--warnbg);color:#7a4900;margin:8px 0}
.empty{padding:30px;text-align:center;color:var(--mut);background:#fff;border:1px dashed var(--line);border-radius:var(--rad)}
.center-load{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;color:var(--mut)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,0,0,.15);border-top-color:currentColor;border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
.spin.big{width:34px;height:34px;border-width:3px;color:var(--pri)}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#0b1f33;color:#fff;padding:11px 18px;border-radius:10px;z-index:100;opacity:0;transition:.25s;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:.92rem}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.err{background:var(--bad)}.toast.warn{background:var(--warn)}
.modal-bg{position:fixed;inset:0;background:rgba(8,20,33,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:860px}
.modal>h3{padding:16px 18px 0;margin:0}
.mbody{padding:12px 18px;overflow:auto}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.kv{width:100%;border-collapse:collapse}.kv td{padding:7px 4px;border-bottom:1px solid #edf1f5}.kv td:first-child{color:var(--ink2)}.kv td:last-child{text-align:right}
.kv.big td{padding:9px 6px;font-size:1rem}
.rules{padding-left:20px;margin:8px 0}.rules li{margin:5px 0}
.instr{background:#f5f8fb;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-top:10px}
/* quiz list */
.qcard{display:flex;justify-content:space-between;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--rad);padding:14px 16px;margin:10px 0;box-shadow:var(--sh);flex-wrap:wrap}
.qc1{flex:1;min-width:240px}.qct{font-weight:700;font-size:1.05rem;margin-bottom:3px}
.qc2{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;justify-content:flex-end;max-width:560px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 4px;overflow-x:auto}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap;font-weight:600}
.tabs a.on{color:var(--pri);border-color:var(--pri)}
.dot{display:inline-block;background:var(--bad);color:#fff;border-radius:10px;padding:0 6px;font-size:.72rem;margin-left:3px}
.savest{font-size:.82rem;color:var(--ok)}.savest.dirty{color:var(--warn);font-weight:700}
/* question editor */
.upl{border:2px dashed #b9cadb;background:#fbfdff}
.prog-msg{padding:10px;background:#eef6fb;border-radius:8px;margin-top:8px}
.qed{background:#fff;border:1px solid var(--line);border-radius:var(--rad);padding:12px 14px;margin:10px 0;box-shadow:var(--sh)}
.qed.bad{border-left:4px solid var(--bad)}
.qedh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.opts-ed{margin:8px 0}
.oed{display:flex;align-items:center;gap:8px;margin:5px 0}
.oed .inp{flex:1}
.oed.on .inp{border-color:var(--ok);background:#f3fbf6}
.cor{display:flex;align-items:center;gap:4px;cursor:pointer;flex:none}
.cor input{width:18px;height:18px;accent-color:var(--ok)}
.cor span{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:#eef2f6;font-weight:700;font-size:.85rem}
.oed.on .cor span{background:var(--ok);color:#fff}
.x{border:0;background:transparent;font-size:20px;color:var(--mut);cursor:pointer;padding:0 6px}
.probs{margin-top:8px;font-size:.84rem;color:var(--bad);background:var(--badbg);padding:6px 10px;border-radius:7px}
.implist{padding-left:0;list-style:none;max-height:50vh;overflow:auto}
.implist li{padding:7px 4px;border-bottom:1px solid #eef2f6}.implist li.bad{background:#fff7f6}
.help h4{margin:14px 0 4px}.help li{margin:4px 0}
.pp{padding:10px 0;border-bottom:1px solid #eef2f6}.ppo{list-style:none;padding-left:8px;margin:6px 0}
.ppo li,.rvo li{padding:3px 6px;border-radius:6px;margin:2px 0}
.right{background:var(--okbg)}.wrongpick{background:var(--badbg)}
.expl{background:#f3f7fb;border-left:3px solid var(--acc);padding:7px 10px;border-radius:6px;margin-top:6px;font-size:.92rem}
.bigcode{font-size:2.2rem;font-weight:800;letter-spacing:.18em;color:var(--pri)}
.linkbox{background:#f3f6f9;border:1px solid var(--line);border-radius:8px;padding:9px;word-break:break-all;font-size:.85rem}
canvas#qr{max-width:100%;height:auto;border:1px solid var(--line);border-radius:10px}
/* tables */
.tablewrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh)}
.card .tablewrap{box-shadow:none}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{background:#f2f6fa;text-align:left;padding:9px 8px;font-weight:700;color:var(--ink2);white-space:nowrap;position:sticky;top:0}
.tbl td{padding:8px;border-top:1px solid #edf1f5;vertical-align:top}
.tbl tbody tr[data-a]{cursor:pointer}.tbl tbody tr[data-a]:hover{background:#f7fbff}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.filters .inp{width:auto;flex:1;min-width:150px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.stats>div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:100px;box-shadow:var(--sh)}
.stats b{display:block;font-size:1.4rem}.stats span{font-size:.78rem;color:var(--mut)}
.minibar{height:4px;background:#e6ebf1;border-radius:3px;margin-top:3px}.minibar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.links{padding-left:18px}.links li{margin:10px 0}
/* examination */
.exam{min-height:100vh;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
.exam.preview .ebar{background:linear-gradient(90deg,#4b2f86,#6c3fc4)}
.ebar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:9px 14px;background:linear-gradient(90deg,#0b2a45,#0b5c8e);color:#fff}
.et{flex:1;min-width:0;display:flex;flex-direction:column}.et b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.et span{font-size:.78rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-family:ui-monospace,Consolas,monospace;font-size:1.25rem;font-weight:800;background:rgba(255,255,255,.14);padding:5px 12px;border-radius:8px;min-width:84px;text-align:center}
.timer.low{background:#b26a00}.timer.crit{background:#c0362c;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.65}}
.btn.sub{background:#fff;color:var(--pri);border-color:#fff}
.prog{height:5px;background:#d6e0ea}.prog div{height:100%;background:var(--acc);transition:width .3s}
.ebody{flex:1;display:grid;grid-template-columns:280px 1fr;gap:16px;max-width:1180px;width:100%;margin:0 auto;padding:16px 16px 90px}
.qpane{background:#fff;border:1px solid var(--line);border-radius:var(--rad);padding:18px 20px;box-shadow:var(--sh);align-self:start}
.qhead{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;border-bottom:1px solid #edf1f5;padding-bottom:9px;margin-bottom:12px;flex-wrap:wrap}
.qtext{font-size:1.1rem;line-height:1.55;white-space:normal;word-wrap:break-word}
.qhint{font-size:.8rem;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:2px solid var(--line);border-radius:11px;cursor:pointer;transition:.12s;background:#fff}
.opt:hover{border-color:#9db8d0}
.opt.on{border-color:var(--pri);background:#eef6fc}
.opt.locked{cursor:not-allowed;opacity:.8}
.opt input{position:absolute;opacity:0;pointer-events:none}
.ol{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#eef2f6;font-weight:800;flex:none;font-size:.9rem}
.opt.on .ol{background:var(--pri);color:#fff}
.ot{padding-top:3px;font-size:1rem}
.palette{background:#fff;border:1px solid var(--line);border-radius:var(--rad);padding:14px;box-shadow:var(--sh);align-self:start;position:sticky;top:70px}
.ph{display:flex;justify-content:space-between;margin-bottom:10px;font-size:.9rem}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.pq{height:38px;border-radius:8px;border:1px solid #c5d1dd;background:#fff;font-weight:700;cursor:pointer;font:inherit;font-weight:700}
.pq:disabled{cursor:default}
.pq.cur{outline:3px solid var(--pri);outline-offset:1px}
.s-a{background:var(--ok)!important;color:#fff;border-color:var(--ok)!important}
.s-v{background:#fbe1de!important;border-color:#eeb1aa!important;color:#8d241c}
.s-n{background:#fff}
.s-r{background:var(--rev)!important;color:#fff;border-color:var(--rev)!important}
.s-ar{background:var(--rev)!important;color:#fff;border-color:var(--ok)!important;box-shadow:inset 0 -5px 0 var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:.76rem;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid #c5d1dd;vertical-align:-1px;margin-right:4px}
.pstats{margin-top:10px;font-size:.84rem;color:var(--ink2);border-top:1px solid #edf1f5;padding-top:8px}
.efoot{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:8px;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);box-shadow:0 -3px 12px rgba(0,0,0,.06);flex-wrap:wrap}
.palbtn{display:none}.pclose{display:none}
.verdict{font-size:2.6rem;font-weight:900;text-align:center;letter-spacing:.1em;margin:8px 0 0}
.verdict.pass{color:var(--ok)}.verdict.fail{color:var(--bad)}.verdict.pend{color:var(--pri);font-size:1.5rem}
.score{text-align:center;font-size:1.3rem;font-weight:700;margin-bottom:12px}.score small{color:var(--mut)}
.rv{padding:12px 0;border-bottom:1px solid #edf1f5}.rvh{margin-bottom:5px}.rvo{list-style:none;padding:0;margin:6px 0}
@media (max-width:860px){
  .grid2{grid-template-columns:1fr}
  .ebody{grid-template-columns:1fr;padding:10px 10px 140px}
  .palette{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;border-radius:16px 16px 0 0;max-height:70vh;overflow:auto;transform:translateY(105%);transition:.25s;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
  body.palopen .palette{transform:none}
  .palbtn{display:inline-flex}.pclose{display:inline-flex}
  .ph{align-items:center;gap:8px}
  .efoot .btn{flex:1 1 auto;padding:10px 8px}
  .qpane{padding:14px}
  .qtext{font-size:1.05rem}
  .top{top:0}.anav{top:56px}
  .who span{display:none}
  .h1{font-size:1.25rem}
  .verdict{font-size:2.1rem}
}
@media (max-width:480px){.bt b{font-size:.92rem}.timer{font-size:1.05rem;min-width:70px;padding:4px 8px}.qc2{justify-content:flex-start}}
@media print{
  .top,.anav,.foot,.noprint,.efoot,.btn,.tabs,.toast{display:none!important}
  body{background:#fff}.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .wrap{max-width:none;padding:0}
}

.vtog{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:9px;padding:6px 10px;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer;flex:none}
.vtog:hover{background:rgba(255,255,255,.25)}.vtog .vi{font-size:1.1rem;line-height:1}
.allview .qpane{background:transparent;border:0;box-shadow:none;padding:0}
.qcardx{background:#fff;border:1px solid var(--line);border-radius:var(--rad);padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh);scroll-margin-top:80px;transition:box-shadow .3s}
.qcardx.flash{box-shadow:0 0 0 3px var(--acc)}
.qacts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
@media (max-width:860px){.vtog span:not(.vi){display:none}.vtog{padding:6px 9px}.allview .qpane{padding:0}.qcardx{padding:14px}}

/* ===== natural scene theme ===== */
html{background:#0b1f33}
body{background:transparent;min-height:100vh}
#scene{position:fixed;inset:0;z-index:-2;overflow:hidden;background:#0b1f33}
#scene .lay{position:absolute;inset:-3%;background-size:cover;background-position:center 60%;opacity:0;transition:opacity 1.2s ease;animation:drift 48s ease-in-out infinite alternate}
#scene .lay.on{opacity:1}
#scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,18,32,.38) 0%,rgba(6,18,32,.08) 38%,rgba(6,18,32,.30) 100%)}
@keyframes drift{from{transform:scale(1) translate(0,0)}to{transform:scale(1.07) translate(-1.2%,-1%)}}
@media (prefers-reduced-motion:reduce){#scene .lay{animation:none}}
:root{--glass:rgba(255,255,255,.86);--glass2:rgba(255,255,255,.93)}
.top{background:linear-gradient(90deg,rgba(8,30,52,.72),rgba(11,92,142,.55));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 2px 14px rgba(0,0,0,.18)}
.anav{background:rgba(255,255,255,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.5)}
.card,.qcard,.qed,.qpane,.palette,.qcardx,.stats>div,.tablewrap,.empty{background:var(--glass);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-color:rgba(255,255,255,.65);box-shadow:0 8px 30px rgba(6,18,32,.18)}
.card.soft{background:rgba(255,255,255,.72)}
.card.warn{background:rgba(255,244,224,.93)}
.upl{background:rgba(251,253,255,.88);border-color:rgba(160,190,215,.9)}
.qpane,.qcardx,.modal{background:var(--glass2)}
.hero{padding:34px 8px 10px}
.hero h1{color:#fff;font-size:2.2rem;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.hero p{color:rgba(255,255,255,.92);text-shadow:0 1px 6px rgba(0,0,0,.5);font-size:1.02rem}
.foot{color:rgba(255,255,255,.85);text-shadow:0 1px 4px rgba(0,0,0,.6)}
.foot b{color:#fff}
main.wrap>.rowb .h1,main.wrap>.h1,main.wrap>.rowb>div>.muted,main.wrap>.rowb>div>a.muted,main.wrap>.rowb>.row>b,main.wrap>.rowb>.row>span:not(.tag):not(.savest),#live>p.muted,main.wrap>.rowb .h1 .badge{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55)}
main.wrap>.rowb .savest{background:rgba(255,255,255,.9);padding:3px 9px;border-radius:12px}
.tabs{background:rgba(255,255,255,.84);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:12px;padding:0 6px;border:0}
.btn{background:rgba(255,255,255,.94)}
.btn.ghost{background:rgba(255,255,255,.80)}
.top .btn.ghost,.ebar .btn.ghost{background:rgba(255,255,255,.12)}
.btn.primary{background:var(--pri)}
.ebar{background:linear-gradient(90deg,rgba(8,30,52,.74),rgba(11,92,142,.58));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.exam.preview .ebar{background:linear-gradient(90deg,rgba(75,47,134,.8),rgba(108,63,196,.65))}
.prog{background:rgba(255,255,255,.35)}
.efoot{background:rgba(255,255,255,.80);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.6)}
.opt{background:rgba(255,255,255,.92)}
.opt.on{background:#e8f4fc}
.allview .qpane{backdrop-filter:none;-webkit-backdrop-filter:none}
.center-load{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.center-load .spin.big{color:#fff}
.verdict{text-shadow:0 2px 10px rgba(255,255,255,.6)}
@media print{#scene{display:none}.card,.qpane{background:#fff;backdrop-filter:none}}

.row.nowrap{flex-wrap:nowrap}.row.nowrap .inp{flex:1;min-width:0}
.drivecard{padding:12px 16px}.drivecard .rowb{margin:0}

.srvlist{display:flex;flex-direction:column;gap:8px}
.srv{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:11px;padding:10px 12px;background:rgba(255,255,255,.9)}
.srv.on{border-color:var(--pri);background:#eef6fc}
.srvl{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;min-width:0}
.srvl input{width:18px;height:18px;flex:none}
.srvl span{display:flex;flex-direction:column;min-width:0}.srvl small{color:var(--mut);font-size:.75rem;overflow:hidden;text-overflow:ellipsis}
.srvchip{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0 0;padding:8px 14px;border-radius:20px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:.88rem}

.countbox{text-align:center;background:linear-gradient(135deg,rgba(11,92,142,.92),rgba(15,163,163,.88));color:#fff;border-radius:14px;padding:16px 12px;margin:14px 0}
.bigcount{font-family:ui-monospace,Consolas,monospace;font-size:2.6rem;font-weight:800;letter-spacing:.04em;margin:4px 0}
.schedli{background:#eef6fc;border-radius:8px;padding:6px 8px;list-style:none;margin-left:-20px}
.schedtag{display:inline-block;background:#eef6fc;color:#0b4a73;border-radius:8px;padding:2px 9px;font-size:.82rem;margin:2px 0 4px}
.tag.part{background:var(--warnbg);color:var(--warn)}

.btn.aibtn{background:linear-gradient(135deg,#6c3fc4,#0fa3a3);color:#fff;border:0}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg label{flex:1;min-width:220px;display:flex;gap:8px;align-items:flex-start;border:2px solid var(--line);border-radius:11px;padding:10px;cursor:pointer;background:#fff}
.seg label:has(input:checked){border-color:#6c3fc4;background:#f5f0ff}.seg input{margin-top:3px}.seg span{display:flex;flex-direction:column}.seg small{color:var(--mut);font-size:.8rem}

</style>
</head>

<script>
/* NK Exam Portal - question bank parser (text, tables, spreadsheet rows) */
(function (root) {
  'use strict';
  var LET = 'ABCDEFGH';
  var BOLD = '⟦B⟧';           // marker added by the DOCX reader for fully-bold option lines

  function clean(s) { return String(s == null ? '' : s).replace(/ /g, ' ').replace(/[​﻿]/g, '').replace(/[ \t]+/g, ' ').trim(); }

  var RX = {
    qPrefix: /^(?:Q(?:uestion|ues|n)?|\u092a\u094d\u0930\u0936\u094d\u0928|\u092a\u094d\u0930\.)\s*\.?\s*(?:No\.?\s*|\u0938\u0902\.?\s*)?(\d{1,4})\s*[.):\-\u2013]?\s*(.*)$/i,
    qBare: /^(\d{1,4})\s*([.)]|:|-|\u2013)\s*(.+)$/,
    opt: /^(?:\(\s*([A-Ha-h])\s*\)|\[\s*([A-Ha-h])\s*\]|([A-Ha-h])\s*[.)\]:](?!\S*\.\S))\s*(.*)$/,
    optWord: /^opt(?:ion)?\s*([A-Ha-h1-8])\s*[.):\-\u2013]?\s+(.*)$/i,
    optNum: /^\(?\s*([1-8])\s*([.)]|\))\s*(.*)$/,
    optRoman: /^\(\s*(i|ii|iii|iv|v|vi|vii|viii)\s*\)\s*(.*)$/i,
    ans: /^(?:[\u2714\u2713\u2705\u2611\u27a4\u25ba\u2192\u21d2*]+\s*)?(?:\(?\s*)?(?:the\s+)?(?:correct\s+|right\s+)?(?:ans(?:wer)?s?|key|correct(?:\s+(?:option|answer|choice|options|answers))?|right\s+answer|\u0909\u0924\u094d\u0924\u0930|\u0938\u0939\u0940\s+\u0909\u0924\u094d\u0924\u0930)\s*(?:\(s\))?\s*(?:\/\s*[^\s:=\-\u2013]+(?:\s+[^\s:=\-\u2013]+)?\s*)?(?:is|are|:|-|\u2013|\u2014|=|\.|\))+\s*(.+)$/i,
    expl: /^(?:explanation|explanations|explain|reason|rationale|solution|hint|justification|because|\u0935\u094d\u092f\u093e\u0916\u094d\u092f\u093e)\s*(?:\/\s*[^\s:]+\s*)?[:\-\u2013\u2014.]\s*(.*)$/i,
    keyHead: /^(?:answer\s*keys?|answers?|key|solutions?|correct\s+answers?)\s*[:\-]?\s*$/i,
    keyItem: /(?:Q\s*)?(\d{1,4})\s*[.):\-\u2013=]?\s*\(?\s*([A-Ha-h](?:\s*[,&\/]\s*[A-Ha-h])*)\s*\)?(?=$|[\s,;|])/g,
    multiHint: /(select|choose|mark|tick)\s+(all|two|three|more than one|multiple)|more than one (correct|answer)|multiple (correct|answers)|all (that|which) apply/i
  };
  var ROMAN = { i: 0, ii: 1, iii: 2, iv: 3, v: 4, vi: 5, vii: 6, viii: 7 };

  function stripMarks(t) {
    var correct = false, bold = false;
    if (t.indexOf(BOLD) >= 0) { bold = true; t = t.split(BOLD).join(''); }
    t = t.trim();
    var m;
    if ((m = t.match(/^(?:\*+|✓|✔|√)\s*(.*)$/))) { correct = true; t = m[1]; }
    if ((m = t.match(/^(.*?)\s*(?:\*+|✓|✔|√|\((?:correct|right|ans(?:wer)?)\)|\[(?:correct|right|ans(?:wer)?)\])$/i))) { correct = true; t = m[1]; }
    return { t: t.trim(), correct: correct, bold: bold };
  }

  /** "B", "(b)", "A, C", "B and D", "2", "Option 3", or the option text itself */
  function parseAnswer(v, options) {
    var s = clean(v).replace(/[.;]+$/, '');
    if (!s) return [];
    var s2 = s.replace(/^(?:options?|choice|is|are)\s*/i, '');
    var toks = s2.replace(/\b(?:and|or|both|&)\b/gi, ' ').split(/[\s,;\/&+]+/).map(function (x) { return x.replace(/^[(\[]+|[)\].:]+$/g, ''); }).filter(Boolean);
    if (toks.length && toks.every(function (x) { return /^[A-Ha-h]$/.test(x); })) return uniq(toks.map(function (x) { return LET.indexOf(x.toUpperCase()); }));
    if (toks.length && toks.every(function (x) { return /^[1-8]$/.test(x); })) return uniq(toks.map(function (x) { return Number(x) - 1; }));
    var m = s2.match(/^\(?([A-Ha-h])\s*[).:\]\-]\s*(.*)$/);
    if (m) return [LET.indexOf(m[1].toUpperCase())];
    if (options && options.length) {
      var low = s.toLowerCase().replace(/\s+/g, ' ');
      for (var i = 0; i < options.length; i++) if (clean(options[i]).toLowerCase() === low) return [i];
      for (var j = 0; j < options.length; j++) { var o = clean(options[j]).toLowerCase(); if (o && (low.indexOf(o) === 0 || o.indexOf(low) === 0) && Math.min(o.length, low.length) >= 3) return [j]; }
    }
    m = s2.match(/^\(?([A-Ha-h])\)?(?:\s|$)/);
    if (m) return [LET.indexOf(m[1].toUpperCase())];
    return [];
  }
  function uniq(a) { return a.filter(function (x, i) { return x >= 0 && a.indexOf(x) === i; }).sort(function (x, y) { return x - y; }); }

  /** split "A) x  B) y  C) z" (also inside a question line) */
  function splitInline(line) {
    var rx = /(^|\s)(\(\s*([A-Ha-h])\s*\)|([A-Ha-h])[.)])(?=\s)/g, m, marks = [];
    while ((m = rx.exec(line))) marks.push({ at: m.index + m[1].length, len: m[2].length, l: (m[3] || m[4]).toUpperCase() });
    var start = -1;
    for (var i = 0; i < marks.length; i++) if (marks[i].l === 'A') { start = i; break; }
    if (start < 0) return null;
    var seq = [marks[start]];
    for (var k = start + 1; k < marks.length; k++) if (marks[k].l === LET.charAt(seq.length)) seq.push(marks[k]);
    if (seq.length < 2) return null;
    var stem = line.slice(0, seq[0].at).trim(), opts = [];
    for (var q = 0; q < seq.length; q++) opts.push(line.slice(seq[q].at + seq[q].len, q + 1 < seq.length ? seq[q + 1].at : line.length).trim());
    return { stem: stem, options: opts };
  }

  function newQ(num, text, prefix, delim) { return { num: num, text: text || '', options: [], marks: [], bold: [], ansRaw: '', exp: '', prefix: prefix, delim: delim, mode: 'q' }; }

  function matchOption(L, cur) {
    var m = L.match(RX.opt);
    if (m) {
      var letter = (m[1] || m[2] || m[3]).toUpperCase(), idx = LET.indexOf(letter);
      if (!cur || idx !== cur.options.length) return null;   // options must come in order A, B, C ...
      return { idx: idx, text: m[4] };
    }
    if ((m = L.match(RX.optWord))) {
      var t = m[1].toUpperCase(), i2 = /[1-8]/.test(t) ? Number(t) - 1 : LET.indexOf(t);
      return cur ? { idx: i2, text: m[2] } : null;
    }
    if (cur && (m = L.match(RX.optRoman))) { var r = ROMAN[m[1].toLowerCase()]; if (r === cur.options.length) return { idx: r, text: m[2] }; }
    if (cur && (m = L.match(RX.optNum))) {
      var n = Number(m[1]), delim = m[2];
      if (n === cur.options.length + 1 && cur.options.length < 8 && (cur.prefix === 'Q' || delim !== cur.delim || n !== cur.num + 1)) return { idx: n - 1, text: m[3] };
    }
    return null;
  }
  function matchQuestion(L) {
    var m = L.match(RX.qPrefix);
    if (m && (m[2] || '').trim()) return { num: Number(m[1]), text: m[2], prefix: 'Q', delim: 'Q' };
    if (m && !(m[2] || '').trim()) return { num: Number(m[1]), text: '', prefix: 'Q', delim: 'Q' };
    m = L.match(RX.qBare);
    if (m) return { num: Number(m[1]), text: m[3], prefix: '', delim: m[2] };
    return null;
  }

  /* ---------- answer keys & explanations, anywhere in the document ---------- */
  var KEYHEAD = /^(?:the\s+)?(?:answer\s*keys?|answers?(?:\s*(?:&|and|with)\s*(?:explanations?|solutions?|reasons?))?|keys?|solutions?|correct\s+answers?|explanations?|answers?\s+sheet|answer\s*&\s*explanation|model\s+answers?|hints?\s*(?:&|and)\s*solutions?)\s*(?:\(.*\))?\s*[:\-]?\s*$/i;
  var KEYHDR = /^(?:\s*(?:S\.?\s*No\.?|Sl\.?\s*No\.?|Q\.?(?:\s*No\.?)?|Ques(?:tion)?(?:\s*No\.?)?|No\.?|#)\s*[|:]?\s*(?:Ans(?:wer)?s?|Key|Correct(?:\s+(?:Answer|Option))?|Option)\s*[|]?\s*)+$/i;
  var PAIR = /(?:Q(?:uestion)?\s*\.?\s*(?:No\.?\s*)?)?(\d{1,4})\s*[.):\-\u2013=>\u2192]?\s*\(?\s*([A-Ha-h](?:\s*(?:,|&|\/|and)\s*[A-Ha-h])*)\s*\)?(?=$|[\s,;|])/g;
  var ENTRY = /^(?:Q(?:uestion)?\s*\.?\s*(?:No\.?\s*)?)?(\d{1,4})\s*[.):\-\u2013]?\s+(.*)$/i;
  var ANSWERISH = /^(?:(?:correct\s+)?(?:ans(?:wer)?|key|option)\s*(?:is)?\s*[:\-\u2013=]?\s*)?\(?\s*[A-Ha-h]\s*\)?(?:\s*(?:,|&|\/|and)\s*\(?[A-Ha-h]\)?)*(?:$|[\s.):\-\u2013,])/i;

  /** a line made only of "number answer" pairs, e.g. "1 B 6 B 11 B 16 C", "1-B, 2-C", "Q1: A" */
  function keyPairs(L) {
    var out = [], m; PAIR.lastIndex = 0;
    var rest = L.replace(PAIR, function (all, n, a) { out.push([Number(n), a]); return ' '; });
    if (!out.length || /[A-Za-z0-9]/.test(rest.replace(/\b(?:ans(?:wer)?s?|key|q|no)\b/gi, ''))) return null;
    return out;
  }
  /** removes tick boxes and bullets; a ticked box before an option marks it correct */
  function normLine(L) {
    var m = L.match(/^[\u2611\u2612\u2705\u2714\u2713\u25a0\u25a3\u25fc\u25c9]\s*(.*)$/);
    if (m && /^\(?\s*[A-Ha-h]\s*[).\]]/.test(m[1])) return m[1] + ' \u2713';
    return L.replace(/^(?:[\u2610\u25a1\u25cb\u25ef\u274d\u2022\u25cf\u25aa\u25e6\u27a2\u27a4\u25ba\u25b6\u2751\u2752\u2b1c\u25fb\u25a2\u2023\u2043]|-(?=\s))\s*/, '');
  }
  function stripFurniture(lines) {
    lines = lines.map(normLine);
    var count = {};
    lines.forEach(function (l) { if (l.length > 6) count[l] = (count[l] || 0) + 1; });
    return lines.map(function (l) {
      if (/^(?:.{0,100}\s)?page\s*\d+(?:\s*(?:of|\/)\s*\d+)?$/i.test(l) && l.length < 120) return '';
      if (/^-?\s*\d+\s*-?$/.test(l) && false) return '';
      if (count[l] >= 3 && !RX.opt.test(l) && !RX.qBare.test(l) && !RX.qPrefix.test(l)) return '';
      return l;
    });
  }

  /** splits lines into question text and answer-key material. keyOnly: the whole text is an answer sheet */
  function splitKeys(lines, keyOnly) {
    var body = [], keys = {}, exps = {}, tails = {}, mode = keyOnly ? 'key' : 'q', cur = null, last = 0, pendNum = null;
    function addExp(n, t) { t = clean(t); if (!t) return; exps[n] = exps[n] ? exps[n] + ' ' + t : t; }
    function entry(n, rest) {
      var ex = rest.match(/^(.*?)\s*(?:explanation|reason|solution|because|rationale|justification)\s*[:\-\u2013]\s*(.*)$/i);
      var a = ex ? ex[1] : rest;
      a = a.replace(/^(?:(?:correct\s+)?(?:ans(?:wer)?|key|option)\s*(?:is)?\s*[:\-\u2013=]?\s*)/i, '');
      var lm = a.match(/^\(?\s*([A-Ha-h](?:\s*(?:,|&|\/|and)\s*[A-Ha-h])*)\s*\)?(?:\s*[.):\-\u2013]+\s*|\s+|$)(.*)$/);
      if (lm) { if (!keys[n]) keys[n] = lm[1]; if (clean(lm[2])) tails[n] = clean(lm[2]); }
      else if (!keys[n]) keys[n] = a;
      if (ex) addExp(n, ex[2]);
      cur = n; last = n;
    }
    for (var i = 0; i < lines.length; i++) {
      var L = lines[i];
      if (!L) continue;
      if (KEYHEAD.test(L)) { mode = 'key'; cur = null; continue; }
      if (KEYHDR.test(L)) { mode = 'key'; cur = null; continue; }
      var pairs = keyPairs(L);
      if (pairs && (pairs.length >= 2 || mode === 'key')) { pairs.forEach(function (p) { if (!keys[p[0]]) keys[p[0]] = p[1]; }); mode = 'key'; cur = null; continue; }
      if (mode !== 'key') { body.push(L); continue; }
      // ---- inside an answer / explanation section ----
      if (/^(?:note|nb|disclaimer|important)\b\s*[:\-.]/i.test(L)) { cur = null; continue; }
      if (pendNum !== null && /^\(?[A-Ha-h]\)?$/.test(L)) { keys[pendNum] = keys[pendNum] || L; cur = pendNum; pendNum = null; continue; }
      if (/^\d{1,4}[.)]?$/.test(L)) { pendNum = Number(L.replace(/\D/g, '')); continue; }
      var m = L.match(ENTRY);
      if (m) {
        var n = Number(m[1]), rest = m[2];
        if (ANSWERISH.test(rest) || n === last + 1 && rest.length < 160 && !/\?\s*$/.test(rest)) { entry(n, rest); continue; }
      }
      var ex = L.match(RX.expl);
      if (ex && cur) { addExp(cur, ex[1]); continue; }
      if (cur) { addExp(cur, L); continue; }
      // looks like questions again
      if (RX.qBare.test(L) || RX.qPrefix.test(L)) { mode = 'q'; body.push(L); continue; }
    }
    return { body: body, keys: keys, exps: exps, tails: tails };
  }

  function parseBody(lines) {
    var out = [], cur = null;
    function finish() { if (cur) out.push(cur); cur = null; }
    function nextNonEmpty(i) { for (var j = i + 1; j < lines.length; j++) if (lines[j]) return lines[j]; return ''; }
    for (var i = 0; i < lines.length; i++) {
      var L = lines[i];
      if (!L) continue;
      var m;
      if (cur && (m = L.match(RX.ans))) {
        var rest = m[1], ex = rest.match(/^(.*?)\s*(?:explanation|reason|solution|because|rationale)\s*[:\-\u2013]\s*(.*)$/i);
        if (ex) { cur.ansRaw = ex[1]; cur.exp = ex[2]; cur.mode = 'exp'; } else { cur.ansRaw = rest; cur.mode = 'ans'; }
        continue;
      }
      if (cur && (m = L.match(RX.expl))) { cur.exp = (cur.exp ? cur.exp + ' ' : '') + m[1]; cur.mode = 'exp'; continue; }
      var o = matchOption(L, cur);
      if (o && cur && cur.mode !== 'ans' && cur.mode !== 'exp') {
        var inl = o.idx === 0 ? splitInline(L) : null;
        if (inl && inl.options.length >= 2 && !inl.stem) { inl.options.forEach(function (t) { addOpt(cur, t); }); cur.mode = 'opt'; continue; }
        addOpt(cur, o.text, o.idx); cur.mode = 'opt'; continue;

  else if (ext === 'docx') local = readDocx(file, progress);
  else if (ext === 'pdf') local = readPdf(file, progress);
  else if (ext === 'txt' || ext === 'text' || ext === 'md') local = fileText(file).then(function (t) { return { kind: 'text', text: t, method: 'text file' }; });
  else if (ext === 'doc' || ext === 'rtf' || ext === 'odt' || IMG_EXT.test(ext)) local = Promise.reject(Object.assign(new Error('server'), { useServer: true }));
  else return Promise.reject(new Error('Unsupported file type .' + ext + '. Use PDF, DOC, DOCX, XLS, XLSX, CSV, TXT or a photo (JPG/PNG).'));
  return local.catch(function (e) {
    if (e && e.scanned) progress('This PDF is a scan (no text). Sending it to the server for OCR text recognition...');
    else if (e && e.useServer) progress(IMG_EXT.test(ext) ? 'Reading the photo with OCR text recognition on the server...' : 'Converting on the server...');
    else progress('Reading on this device failed (' + (e && e.message) + '). Trying the server...');
    return serverRaw(file);
  });
}

function rawQuestions(r) {
  if (r.kind === 'rows') return QParse.fromSheets(r.sheets);
  var qs = QParse.fromText(r.text || '');
  (r.tables || []).forEach(function (t) { var tq = QParse.fromRows(t); if (tq.length) qs = qs.concat(tq); });
  return qs;
}
function rawText(r) {
  if (r.kind === 'rows') return r.sheets.map(function (s) { return s.rows.map(function (row) { return row.filter(function (c) { return String(c).trim(); }).join(' '); }).join('\n'); }).join('\n');
  return (r.text || '') + '\n' + (r.tables || []).map(function (t) { return t.map(function (row) { return row.join(' '); }).join('\n'); }).join('\n');
}

/** returns Promise<{questions, method}> */
function extractQuestions(file, progress) {
  return extractRaw(file, progress).then(function (r) {
    var qs = rawQuestions(r);
    var ext = extOf(file.name);
    if (qs.length || r.server || ext === 'csv' || ext === 'txt') return { questions: qs, method: r.method };
    return serverRaw(file).then(function (s) { var q2 = rawQuestions(s); return q2.length ? { questions: q2, method: s.method } : { questions: qs, method: r.method }; }, function () { return { questions: qs, method: r.method }; });
  });
}

/** answer sheet / answer key in any layout -> {answers, explanations, tails} */

function fileText(file) {
  return new Promise(function (ok, no) { var fr = new FileReader(); fr.onload = function () { ok(String(fr.result)); }; fr.onerror = function () { no(fr.error); }; fr.readAsText(file); });
}

function readSheet(file, progress) {
  progress('Reading spreadsheet...');
  return Promise.all([lib('xlsx'), fileToBuf(file)]).then(function (r) {
    var X = r[0], wb = X.read(new Uint8Array(r[1]), { type: 'array', cellText: true, cellDates: false, raw: false });
    var sheets = wb.SheetNames.map(function (n) { return { name: n, rows: X.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: '', blankrows: false }) }; });
    return { kind: 'rows', sheets: sheets, method: 'spreadsheet (' + sheets.length + ' sheet' + (sheets.length > 1 ? 's' : '') + ')' };

function readDocx(file, progress) {
  progress('Reading Word document...');

    });

/** Word HTML -> text lines; auto-numbered lists become "Q1." / "(a)" lines; tables are kept as rows */
function docHtmlToText(html) {
  var div = document.createElement('div'); div.innerHTML = html;
  var lines = [], tables = [], qn = 0, lastWasQuestion = false;
  var B = QParse.BOLD;
  function txt(el) {
    var c = el.cloneNode(true);
    qsa('ol,ul', c).forEach(function (x) { x.remove(); });
    qsa('br', c).forEach(function (b) { b.replaceWith('\n'); });
    return c.textContent.replace(/[ \t]+/g, ' ').trim();
  }
  function allBold(el) {
    var t = txt(el); if (!t) return false;
    var c = el.cloneNode(true); qsa('ol,ul', c).forEach(function (x) { x.remove(); });
    var b = qsa('strong,b', c).map(function (x) { return x.textContent; }).join('').replace(/\s+/g, '');
    return b.length && b === t.replace(/\s+/g, '');
  }
  function isOptionLine(t) { return /^(?:\(\s*[A-Ha-h]\s*\)|[A-Ha-h]\s*[.)])\s+/.test(t); }
  function walkList(ol, depth) {
    var items = qsa(':scope > li', ol), ordered = ol.tagName === 'OL';
    // one flat numbered list holding questions and their options: questions end with "?" or ":" (or a blank ____)
    if (ordered && depth === 0 && items.length >= 3) {
      var isQ = items.map(function (li) { return /[?:]\s*$|_{3,}/.test(txt(li)); });
      var nq = isQ.filter(Boolean).length;
      if (isQ[0] && nq < items.length && items.length - nq >= 2 * nq) {
        var oi = 0;
        items.forEach(function (li, i) {
          var t = txt(li);
          if (isQ[i]) { qn++; lines.push('Q' + qn + '. ' + t); oi = 0; }
          else lines.push('(' + 'abcdefgh'.charAt(Math.min(oi++, 7)) + ') ' + t + (allBold(li) ? B : ''));
          qsa(':scope > ol, :scope > ul', li).forEach(function (sub) { walkList(sub, depth + 1); });
        });
        lastWasQuestion = false;
        return;
      }
    }
    var asOptions = depth > 0 || (ordered && lastWasQuestion && items.length >= 2 && items.length <= 8 && items.every(function (li) { return txt(li).length < 300; }));
    items.forEach(function (li, i) {
      var t = txt(li);
      if (asOptions) { lines.push('(' + 'abcdefgh'.charAt(i) + ') ' + t + (allBold(li) ? B : '')); lastWasQuestion = false; }
      else if (ordered) { qn++; lines.push('Q' + qn + '. ' + t); lastWasQuestion = true; }
      else { lines.push(t); }
      qsa(':scope > ol, :scope > ul', li).forEach(function (sub) { walkList(sub, depth + 1); });
    });
    if (asOptions) lastWasQuestion = false;
  }
  Array.prototype.forEach.call(div.children, function (el) {
    var tag = el.tagName;
    if (tag === 'OL' || tag === 'UL') { walkList(el, 0); return; }
    if (tag === 'TABLE') {
      var rows = qsa('tr', el).map(function (tr) { return qsa('td,th', tr).map(function (td) { qsa('br', td).forEach(function (b) { b.replaceWith('\n'); }); return td.textContent.trim(); }); });
      tables.push(rows); return;
    }
    var t = txt(el);
    if (!t) return;
    t.split('\n').forEach(function (part) {
      part = part.trim(); if (!part) return;
      var opt = isOptionLine(part);
      lines.push(part + (opt && allBold(el) ? B : ''));
      lastWasQuestion = !opt && /\?\s*$|:\s*$|^Q\s*\d|^\d+\s*[.)]/i.test(part);
    });
  });
  return { text: lines.join('\n'), tables: tables };
}

function readPdf(file, progress) {
  progress('Reading PDF...');
  return lib('pdfw').then(function () { return lib('pdf'); }).then(function (pdfjs) {
    try { pdfjs.GlobalWorkerOptions.workerSrc = IN_GAS ? LIBS.pdfw.cdn : LIBS.pdfw.local; } catch (e) { }
    return fileToBuf(file).then(function (buf) { return pdfjs.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise; });
  }).then(function (doc) {
    var pages = [], chain = Promise.resolve();
    for (var p = 1; p <= doc.numPages; p++) (function (p) {
      chain = chain.then(function () {
        progress('Reading PDF page ' + p + ' of ' + doc.numPages + '...');
        return doc.getPage(p).then(function (pg) { return pg.getTextContent(); }).then(function (tc) {
          var out = '', lastY = null, lastX = null;
          tc.items.forEach(function (it) {
            if (it.str === undefined) return;
            var y = it.transform ? it.transform[5] : 0, x = it.transform ? it.transform[4] : 0, h = Math.abs(it.transform ? it.transform[3] : 10) || 10;
            if (lastY !== null && Math.abs(y - lastY) > h * 0.45) out += '\n';
            else if (lastX !== null && out && !/\s$/.test(out) && it.str && !/^\s/.test(it.str) && x - lastX > h * 0.18) out += ' ';
            out += it.str;
            if (it.hasEOL) { out += '\n'; lastY = null; lastX = null; } else { lastY = y; lastX = x + (it.width || 0); }
          });
          pages.push(out);
        });
      });
    })(p);
    return chain.then(function () {
      var text = pages.join('\n');
      if (text.replace(/\s/g, '').length < 30 * Math.max(1, Math.min(doc.numPages, 3))) throw Object.assign(new Error('no text'), { scanned: true });
      return { kind: 'text', text: text, method: 'PDF (' + doc.numPages + ' page' + (doc.numPages > 1 ? 's' : '') + ')' };
    });
  });
}

function serverRaw(file) {
  return fileToB64(file).then(function (b64) {
    return api('extractFile', { name: file.name, mime: file.type || '', b64: b64 });
  }).then(function (r) {
    var img = IMG_EXT.test(extOf(file.name)), pdf = extOf(file.name) === 'pdf';
    var m = 'server conversion (Google Drive' + (img || pdf ? ' OCR' : '') + ')';
    return r.kind === 'rows' ? { kind: 'rows', sheets: r.sheets, method: m, server: true } : { kind: 'text', text: r.text || '', tables: r.tables || [], method: m, server: true };
  });
}

/** basic generator without AI: fill-in-the-blank questions from important sentences */
function basicQuiz(text, count) {
  var STOP = ' about above after again against because before being below between could during every further having other should their there these those through under until which while would where whose shall might these whether within without also into from that this with have will been were when what your them they then than only such more most some very each both same into over upon ';
  var sents = String(text || '').replace(/\s+/g, ' ').split(/(?<=[.!?।])\s+/).map(function (x) { return x.trim(); })
    .filter(function (x) { var w = x.split(' ').length; return x.length >= 40 && x.length <= 260 && w >= 7 && w <= 45 && !/page\s*\d+/i.test(x); });
  var pools = { num: [], cap: [], word: [] };
  function terms(s) {
    var out = [];
    (s.match(/\b\d+(?:[.,]\d+)?\s?(?:%|°C|°F|mm|cm|km|kg|m|tonnes?|t|ppm|bar|kV|V|A|kW|MW|hours?|days?|months?|years?|minutes?|times?)?(?=[\s,.;)]|$)/g) || []).forEach(function (t) { out.push({ k: 'num', t: t.trim() }); });
    (s.slice(1).match(/\b[A-Z][A-Za-z0-9-]{2,}(?:\s+[A-Z][A-Za-z0-9-]{2,}){0,3}/g) || []).forEach(function (t) { out.push({ k: 'cap', t: t }); });
    (s.match(/\b[a-z][a-z-]{6,}\b/g) || []).forEach(function (t) { if (STOP.indexOf(' ' + t + ' ') < 0) out.push({ k: 'word', t: t }); });
    return out;
  }
  sents.forEach(function (s) { terms(s).forEach(function (x) { if (pools[x.k].indexOf(x.t) < 0) pools[x.k].push(x.t); }); });
  var order = sents.map(function (s, i) { return i; }), out = [];
  for (var i = order.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = order[i]; order[i] = order[j]; order[j] = t; }
  for (var n = 0; n < order.length && out.length < count; n++) {
    var s = sents[order[n]], cand = terms(s).sort(function (a, b) { var r = { num: 0, cap: 1, word: 2 }; return r[a.k] - r[b.k] || b.t.length - a.t.length; });
    for (var c = 0; c < cand.length; c++) {
      var term = cand[c], pool = pools[term.k].filter(function (p) { return p !== term.t && s.indexOf(p) < 0 && p.toLowerCase() !== term.t.toLowerCase(); });
      if (pool.length < 3) continue;
      for (var k = pool.length - 1; k > 0; k--) { var j2 = Math.floor(Math.random() * (k + 1)); var t2 = pool[k]; pool[k] = pool[j2]; pool[j2] = t2; }
      var opts = [term.t].concat(pool.slice(0, 3)), pos = Math.floor(Math.random() * 4);
      opts.splice(0, 1); opts.splice(pos, 0, term.t);
      out.push({ text: 'Fill in the blank: ' + s.replace(term.t, '________'), type: 'single', options: opts, correct: [pos], explanation: s, marks: '' });
      break;
    }
  }
  return out;
}

          var n = Math.min(15, want - all.length);
          if (n <= 0) return all;
          say('AI is writing questions ' + (all.length + 1) + '-' + (all.length + n) + ' of ' + want + '...');
          return api('aiQuiz', { mode: 'generate', text: text, command: cmd, count: n, qtype: qs('#aitype', m.el).value, options: qs('#aiopts', m.el).value, difficulty: qs('#aidiff', m.el).value, language: qs('#ailang', m.el).value, avoid: avoid.concat(all.map(function (q) { return q.text; })) })
            .then(function (r) { model = r.model; if (!r.questions.length) return all; all = all.concat(r.questions); return step(); });

      }
      var local = QParse.fromText(text).length, from = 1, empty = 0;

/* ---------- examination engine (client) ---------- */
var EX = null;   // live exam state

function beginExam(p) {
  var st = {
    api: S.api, attemptId: p.attemptId, key: p.key, p: p,
    answers: p.answers || {}, review: p.review || [], visited: {}, current: p.questions ? Math.min(p.current || 0, p.questions.length - 1) : 0,
    offset: p.serverTime - Date.now(), dirty: false, submitted: false, preview: false
  };
  store.set('exam', st);
  go('#/exam');
}

addRoute(/^\/exam$/, function () {
  var st = store.get('exam', null);
  if (!st || !st.attemptId) { go('#/'); return; }
  if (!IN_GAS && st.api && st.api !== S.api) { S.api = st.api; }
  EX = st; EX.preview = false;
  if (st.p.waiting) { renderLobby(); return; }
  // refresh from server (resume, time sync); falls back to the saved copy when offline
  api('saveProgress', { attemptId: st.attemptId, key: st.key, answers: st.answers, review: st.review, current: st.current }).then(function (r) {
    if (r.submitted) return fetchResult(st);
    if (typeof r.remainingSec === 'number' && r.serverTime) EX.offset = r.serverTime - Date.now();
    if (r.expired) { EX.expired = true; }
    renderExam();
    if (r.expired) timeUp();
  }, function (e) {
    if (e.code === 'NO_ATTEMPT' || e.code === 'VOID') { store.del('exam'); errorView(e); return; }
    toast('Offline: your answers are kept on this device and sent when the connection returns.', 'warn');
    renderExam();
  });
});

/* ---------- waiting room for fixed-time examinations ---------- */
function renderLobby() {
  var p = EX.p, fetching = false, iv;
  setScene('lake');
  $app.innerHTML = header() + '<main class="wrap narrow"><div class="card lobby"><div class="eyebrow">Waiting room &middot; ' + esc(p.quiz.code) + '</div><h1 class="h1">' + esc(p.quiz.title) + '</h1>' +
    '<p>Welcome <b>' + esc(p.candidate.name) + '</b> (' + esc(p.candidate.mobile) + '). You are logged in.</p>' +
    '<div class="countbox"><div>Examination starts in</div><div class="bigcount" id="lcount">' + fmtCount((p.startAt - (Date.now() + EX.offset)) / 1000) + '</div><div class="small">at <b>' + fmtClock(p.startAt) + '</b> &middot; ends at <b>' + fmtClock(p.deadline) + '</b> &middot; ' + p.quiz.questions + ' questions</div></div>' +
    '<ul class="rules"><li>Keep this page open. The question paper opens automatically at ' + fmtClock(p.startAt) + '.</li><li>Questions appear one by one' + (p.quiz.allowNav ? '; you can go back, mark for review, or view all questions on one page' : '; you cannot go back') + '.</li>' + (p.quiz.negative ? '<li class="neg">Negative marking: &minus;' + p.quiz.negWrong + ' per wrong answer</li>' : '') + '<li>The examination ends for everyone at ' + fmtClock(p.deadline) + '; answers are then submitted automatically.</li></ul>' +
    (p.quiz.instructions ? '<div class="instr"><b>Instructions</b><div>' + nl2br(p.quiz.instructions) + '</div></div>' : '') +
    '<div id="lmsg" class="muted small center mt"></div></div></main>' + footer();
  function fetchStart() {
    api('resumeExam', { attemptId: EX.attemptId, key: EX.key }).then(function (r) {
      if (r.submitted) { store.del('exam'); store.set('lastResult', r.result); showResult(r.result); return; }
      if (r.waiting) { EX.offset = r.serverTime - Date.now(); p.startAt = r.startAt; fetching = false; return; }
      clearInterval(iv); beginExam(r);
    }).catch(function (e) {
      if (e.code === 'NO_ATTEMPT' || e.code === 'VOID') { clearInterval(iv); store.del('exam'); errorView(e); return; }
      var m = qs('#lmsg'); if (m) m.textContent = 'Connecting... (' + e.message + ')';
      setTimeout(function () { fetching = false; }, 3000);
    });
  }
  iv = setInterval(function () {
    var rem = (p.startAt - (Date.now() + EX.offset)) / 1000, el = qs('#lcount');
    if (el) el.textContent = fmtCount(rem);
    if (rem <= 0 && !fetching) { fetching = true; var m = qs('#lmsg'); if (m) m.textContent = 'Opening the question paper...'; setTimeout(fetchStart, Math.random() * 3000); }
  }, 500);
  onLeave(function () { clearInterval(iv); });
}

function remaining() {
  var dl = EX.p.deadline;
  if (!dl) return -1;
  return Math.max(0, Math.floor((dl - (Date.now() + (EX.offset || 0))) / 1000));
}

function qStatus(q) {
  var a = EX.answers[q.id], ans = a && a.length, rev = EX.review.indexOf(q.id) >= 0;
  return ans && rev ? 'ar' : rev ? 'r' : ans ? 'a' : EX.visited[q.id] ? 'v' : 'n';
}

function optHtml(q, qi, chosen, locked) {
  return q.options.map(function (o, i) {
    var on = chosen.indexOf(o.k) >= 0;
    return '<label class="opt ' + (on ? 'on' : '') + (locked ? ' locked' : '') + '"><input type="' + (q.type === 'multi' ? 'checkbox' : 'radio') + '" name="opt' + qi + '" data-q="' + qi + '" value="' + o.k + '" ' + (on ? 'checked' : '') + (locked ? ' disabled' : '') + '><span class="ol">' + letter(i) + '</span><span class="ot">' + nl2br(o.t) + '</span></label>';
  }).join('');
}
function qMarks(q) { var p = EX.p; return (q.marks !== '' && q.marks != null ? q.marks : p.quiz.marksCorrect) + ' mark(s)' + (p.quiz.negative ? ' &middot; &minus;' + p.quiz.negWrong + ' if wrong' : ''); }

function renderExam() {
  var p = EX.p, nav = p.quiz.allowNav, total = p.questions.length;
  if (!nav) EX.viewAll = false;
  var all = !!EX.viewAll, q = p.questions[EX.current];
  setScene(all ? 'valley' : SCENE_ORDER[EX.current % SCENE_ORDER.length]);
  EX.visited[q.id] = 1;
  var answered = p.questions.filter(function (x) { var a = EX.answers[x.id]; return a && a.length; }).length;
  var marked = EX.review.length, locked = EX.locked;
  var body;
  if (all) {
    p.questions.forEach(function (x) { EX.visited[x.id] = 1; });
    body = p.questions.map(function (x, i) {
      var rev = EX.review.indexOf(x.id) >= 0;
      return '<section class="qcardx" id="qc' + i + '"><div class="qhead"><span>Question <b>' + (i + 1) + '</b> of ' + total + '</span><span class="muted">' + qMarks(x) + '</span></div>' +
        '<div class="qtext">' + nl2br(x.text) + '</div><div class="qhint">' + (x.type === 'multi' ? 'Select ALL correct answers' : 'Select ONE answer') + '</div>' +
        '<div class="opts">' + optHtml(x, i, EX.answers[x.id] || [], locked) + '</div>' +
        '<div class="qacts"><button class="btn xs ghost" data-mark="' + i + '">' + (rev ? '&#9873; Marked for review' : '&#9872; Mark for review') + '</button><button class="btn xs ghost" data-clear="' + i + '" ' + (locked ? 'disabled' : '') + '>Clear answer</button></div></section>';
    }).join('');
  } else {
    body = '<div class="qhead"><span>Question <b>' + (EX.current + 1) + '</b> of ' + total + '</span><span class="muted">' + qMarks(q) + '</span></div>' +
      '<div class="qtext">' + nl2br(q.text) + '</div>' +
      '<div class="qhint">' + (q.type === 'multi' ? 'Select ALL correct answers' : 'Select ONE answer') + '</div>' +
      '<div class="opts" id="opts">' + optHtml(q, EX.current, EX.answers[q.id] || [], locked) + '</div>';
  }
  var pal = p.questions.map(function (x, i) { return '<button class="pq s-' + qStatus(x) + (i === EX.current && !all ? ' cur' : '') + '" id="pq' + i + '" data-go="' + i + '" ' + (nav ? '' : 'disabled') + '>' + (i + 1) + '</button>'; }).join('');
  var last = EX.current === total - 1;
  var toggle = nav ? '<button class="vtog" id="vtog" title="Change view">' + (all ? '<span class="vi">&#9638;</span><span>One by one</span>' : '<span class="vi">&#9776;</span><span>All questions</span>') + '</button>' : '';
  $app.innerHTML =
    '<div class="exam ' + (EX.preview ? 'preview' : '') + (all ? ' allview' : '') + '">' +
    '<header class="ebar">' + toggle + '<div class="et"><b>' + esc(p.quiz.title) + '</b><span>' + esc(p.candidate.name) + ' &middot; ' + esc(p.candidate.mobile || p.candidate.cid) + (EX.preview ? ' &middot; <i>PREVIEW</i>' : '') + '</span></div>' +
    '<div class="timer" id="timer">' + (p.deadline ? fmtDur(remaining()) : 'No limit') + '</div>' +
    '<button class="btn sm sub" id="subTop">Submit</button></header>' +
    '<div class="prog"><div style="width:' + (answered / total * 100) + '%"></div></div>' +
    '<div class="ebody">' +
    '<aside class="palette" id="pal"><div class="ph"><b>Questions</b><span>' + answered + '/' + total + ' answered</span><button class="btn xs ghost pclose" id="pclose">Close &times;</button></div>' +
    (nav ? '' : '<p class="muted small">Questions must be answered in order.</p>') +
    '<div class="pgrid">' + pal + '</div>' +
    '<div class="legend"><span><i class="s-a"></i>Answered</span><span><i class="s-v"></i>Not answered</span><span><i class="s-n"></i>Not visited</span>' + (nav ? '<span><i class="s-r"></i>Marked for review</span><span><i class="s-ar"></i>Answered &amp; marked</span>' : '') + '</div>' +
    '<div class="pstats">Answered <b>' + answered + '</b> &middot; Unanswered <b>' + (total - answered) + '</b>' + (nav ? ' &middot; Marked <b>' + marked + '</b>' : '') + '</div></aside>' +
    '<main class="qpane">' + body +
    (locked ? '<div class="err-box mt">Time is over. Answers can no longer be changed.' + (EX.submitting ? ' Submitting...' : ' Press Submit.') + '</div>' : '') +
    (all ? '<div class="center mt"><button class="btn primary big" id="subBot">Submit examination</button></div>' : '') +
    '</main></div>' +
    '<footer class="efoot">' + (all ? '<button class="btn ghost palbtn" id="palbtn">' + answered + '/' + total + ' answered</button><button class="btn ghost" id="toTop">&#9650; Top</button>' :
    (nav ? '<button class="btn ghost" id="prev" ' + (EX.current === 0 ? 'disabled' : '') + '>&#9664; Back</button>' : '') +
    (nav ? '<button class="btn ghost" id="mark">' + (EX.review.indexOf(q.id) >= 0 ? 'Unmark review' : 'Mark for review') + '</button>' : '') +
    '<button class="btn ghost" id="clr" ' + (locked ? 'disabled' : '') + '>Clear</button>' +
    '<button class="btn ghost palbtn" id="palbtn">' + answered + '/' + total + '</button>' +
    (last ? '<button class="btn primary" id="subBot">Submit</button>' : '<button class="btn primary" id="next">' + (nav ? 'Save &amp; Next &#9654;' : 'Next &#9654;') + '</button>')) +
    '</footer></div>';

  qsa('.opts input').forEach(function (inp) {
    inp.onchange = function () {
      if (EX.locked) return;
      var qi = Number(inp.dataset.q), x = p.questions[qi], k = Number(inp.value), cur = (EX.answers[x.id] || []).slice();
      if (x.type === 'multi') { if (inp.checked) { if (cur.indexOf(k) < 0) cur.push(k); } else cur = cur.filter(function (v) { return v !== k; }); }
      else cur = [k];

      updateCounts(qi);

  function move(i) { EX.current = Math.max(0, Math.min(total - 1, i)); changed(true); renderExam(); window.scrollTo(0, 0); }
  if (qs('#vtog')) qs('#vtog').onclick = function () {
    EX.viewAll = !EX.viewAll; changed(true); renderExam();
    if (EX.viewAll) { var c = qs('#qc' + EX.current); if (c) c.scrollIntoView(); } else window.scrollTo(0, 0);
  };
  if (qs('#prev')) qs('#prev').onclick = function () { move(EX.current - 1); };
  if (qs('#next')) qs('#next').onclick = function () {
    if (!nav && !(EX.answers[q.id] || []).length) {
      confirmBox('Skip this question?', 'You have not answered this question. You cannot come back to it later.', 'Skip').then(function (y) { if (y) move(EX.current + 1); });
      return;
    }
    move(EX.current + 1);
  };
  if (qs('#mark')) qs('#mark').onclick = function () { toggleReview(q.id); renderExam(); };
  if (qs('#clr')) qs('#clr').onclick = function () { delete EX.answers[q.id]; changed(); renderExam(); };
  qsa('[data-mark]').forEach(function (b) { b.onclick = function () { var i = Number(b.dataset.mark), x = p.questions[i]; toggleReview(x.id); b.innerHTML = EX.review.indexOf(x.id) >= 0 ? '&#9873; Marked for review' : '&#9872; Mark for review'; updateCounts(i); }; });
  qsa('[data-clear]').forEach(function (b) { b.onclick = function () { var i = Number(b.dataset.clear), x = p.questions[i]; delete EX.answers[x.id]; changed(); qsa('input[name="opt' + i + '"]').forEach(function (i2) { i2.checked = false; i2.closest('.opt').classList.remove('on'); }); updateCounts(i); }; });
  qsa('[data-go]').forEach(function (b) {
    b.onclick = function () {
      if (!nav) return;
      var i = Number(b.dataset.go);
      document.body.classList.remove('palopen');
      if (all) { EX.current = i; var c = qs('#qc' + i); if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'start' }); c.classList.add('flash'); setTimeout(function () { c.classList.remove('flash'); }, 900); } }
      else move(i);
    };
  });
  qs('#palbtn').onclick = function () { document.body.classList.toggle('palopen'); };
  qs('#pclose').onclick = function () { document.body.classList.remove('palopen'); };
  if (qs('#toTop')) qs('#toTop').onclick = function () { window.scrollTo({ top: 0, behavior: 'smooth' }); };
  qs('#subTop').onclick = askSubmit;
  if (qs('#subBot')) qs('#subBot').onclick = askSubmit;
  startTicker();
}

function toggleReview(id) { var i = EX.review.indexOf(id); if (i >= 0) EX.review.splice(i, 1); else EX.review.push(id); changed(); }

function updateCounts(qi) {
  var p = EX.p, total = p.questions.length, answered = p.questions.filter(function (x) { var a = EX.answers[x.id]; return a && a.length; }).length;
  var bar = qs('.prog div'); if (bar) bar.style.width = (answered / total * 100) + '%';
  var pb = qs('#palbtn'); if (pb) pb.textContent = answered + '/' + total + (EX.viewAll ? ' answered' : '');
  if (qi === undefined) qi = EX.current;
  var btn = qs('#pq' + qi); if (btn) btn.className = 'pq s-' + qStatus(p.questions[qi]) + (qi === EX.current && !EX.viewAll ? ' cur' : '');
  var ph = qs('.ph span'); if (ph) ph.textContent = answered + '/' + total + ' answered';
  var ps = qs('.pstats'); if (ps) ps.innerHTML = 'Answered <b>' + answered + '</b> &middot; Unanswered <b>' + (total - answered) + '</b>' + (p.quiz.allowNav ? ' &middot; Marked <b>' + EX.review.length + '</b>' : '');
}

var saveTimer = null, tick = null, lastSaved = 0;
function changed(soft) {
  EX.dirty = true;
  if (!EX.preview) store.set('exam', EX);
  if (EX.preview) return;
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(syncProgress, soft ? 1500 : 4000);
}
function syncProgress() {
  if (!EX || EX.preview || EX.submitted || !EX.dirty) return;
  if (Date.now() - lastSaved < 15000) { saveTimer = setTimeout(syncProgress, 15000 - (Date.now() - lastSaved)); return; }
  lastSaved = Date.now();
  var snap = JSON.stringify(EX.answers);
  api('saveProgress', { attemptId: EX.attemptId, key: EX.key, answers: EX.answers, review: EX.review, current: EX.current }).then(function (r) {
    if (JSON.stringify(EX.answers) === snap) EX.dirty = false;
    if (r.serverTime) EX.offset = r.serverTime - Date.now();
    if (r.submitted) fetchResult(EX);
  }, function () { });
}

function startTicker() {
  if (tick) return;
  var beforeUnload = function (e) { if (EX && !EX.submitted && !EX.preview) { e.preventDefault(); e.returnValue = ''; } };
  window.addEventListener('beforeunload', beforeUnload);
  var iv = setInterval(function () {
    if (!EX || EX.submitted) return;
    var t = qs('#timer');
    if (!EX.p.deadline) return;
    var rem = remaining();
    if (t) { t.textContent = fmtDur(rem); t.className = 'timer' + (rem <= 60 ? ' crit' : rem <= 300 ? ' low' : ''); }
    if (rem === 300 && !EX.warned5) { EX.warned5 = 1; toast('5 minutes left', 'warn'); }
    if (rem <= 0 && !EX.locked) timeUp();
  }, 500);
  var hb = setInterval(function () { if (EX && EX.dirty) syncProgress(); }, 45000);
  tick = iv;
  onLeave(function () { clearInterval(iv); clearInterval(hb); tick = null; window.removeEventListener('beforeunload', beforeUnload); if (saveTimer) clearTimeout(saveTimer); });
}

function timeUp() {
  if (EX.locked) return;
  EX.locked = true;
  if (!EX.preview) store.set('exam', EX);
  if (EX.p.quiz.autoSubmit || EX.expired) {
    EX.submitting = true; renderExam();
    toast('Time is over. Submitting your answers...', 'warn');
    setTimeout(function () { doSubmit(true); }, EX.preview ? 300 : Math.floor(Math.random() * 4000));
  } else { renderExam(); toast('Time is over. Press Submit.', 'warn'); }
}

function askSubmit() {
  var p = EX.p, total = p.questions.length;
  var answered = p.questions.filter(function (x) { var a = EX.answers[x.id]; return a && a.length; }).length;
  var html = '<h3>Submit examination?</h3><div class="mbody"><table class="kv"><tr><td>Total questions</td><td><b>' + total + '</b></td></tr><tr><td>Answered</td><td><b>' + answered + '</b></td></tr><tr><td>Not answered</td><td><b>' + (total - answered) + '</b></td></tr>' +
    (p.quiz.allowNav ? '<tr><td>Marked for review</td><td><b>' + EX.review.length + '</b></td></tr>' : '') + '</table>' +
    (total - answered && p.quiz.negative && p.quiz.negUnanswered > 0 ? '<p class="neg">Unanswered questions lose ' + p.quiz.negUnanswered + ' mark each.</p>' : '') +
    '<p>After submitting you cannot change your answers.</p></div><div class="mfoot"><button class="btn ghost" data-close>Go back</button><button class="btn primary" id="yes">Yes, submit</button></div>';
  var m = modal(html);
  qs('#yes', m.el).onclick = function () { m.close(); doSubmit(false); };
}

function doSubmit(auto) {
  if (EX.submitted) return;
  if (EX.preview) { EX.submitted = true; showResult(previewGrade(EX), true); return; }
  EX.submitting = true; store.set('exam', EX);
  loading(auto ? 'Time is over. Submitting your answers...' : 'Submitting your answers...');
  var payload = { attemptId: EX.attemptId, key: EX.key, answers: EX.answers, auto: !!auto };
  sendSubmission(payload, 0).then(function (r) {
    EX.submitted = true; store.del('exam');
    store.set('lastResult', r.result);
    showResult(r.result);
  }).catch(function (e) {
    if (e.code === 'VOID' || e.code === 'NO_ATTEMPT') { store.del('exam'); errorView(e); return; }
    // keep it safely on the device and retry automatically
    var box = store.get('outbox', []);
    if (!box.some(function (x) { return x.attemptId === payload.attemptId; })) box.push(Object.assign({ api: S.api, title: EX.p.quiz.title, t: Date.now() }, payload));
    store.set('outbox', box); store.del('exam'); EX.submitted = true;
    $app.innerHTML = header() + '<main class="wrap narrow"><div class="card warn"><h2>Answers saved on this device</h2><p>The server could not be reached (' + esc(e.message) + '). Your answers are stored safely on this device and will be sent automatically when the internet connection is back. Keep this app or page open.</p>' +
      '<p class="muted small">Your answers were locked at ' + fmtDate(Date.now()) + '. Late delivery does not change your time.</p><button class="btn primary" id="retry">Send now</button> <a class="btn ghost" href="#/">Home</a></div></main>';
    qs('#retry').onclick = function () { flushOutbox(true); };
  });
}

function sendSubmission(payload, tries) {
  return api('submitExam', payload).catch(function (e) {
    if (e.code || tries >= 3) throw e;
    return new Promise(function (ok) { setTimeout(ok, 2000 + tries * 3000 + Math.random() * 2000); }).then(function () { return sendSubmission(payload, tries + 1); });
  });
}

var flushing = false;
function flushOutbox(show) {
  var box = store.get('outbox', []);
  if (!box.length || flushing) return;
  flushing = true;
  var done = 0, chain = Promise.resolve();
  box.forEach(function (it) {
    chain = chain.then(function () {
      var saveApi = S.api; if (it.api && !IN_GAS) S.api = it.api;
      return api('submitExam', it).then(function (r) {
        done++;
        store.set('outbox', store.get('outbox', []).filter(function (x) { return x.attemptId !== it.attemptId; }));
        store.set('lastResult', r.result);
        if (show) showResult(r.result);
      }, function (e) {
        if (e.code) store.set('outbox', store.get('outbox', []).filter(function (x) { return x.attemptId !== it.attemptId; }));
        if (show) toast('Not sent yet: ' + e.message, 'err');
      }).then(function () { S.api = saveApi; });
    });
  });
  chain.then(function () { flushing = false; if (done && !show) toast(done + ' saved examination(s) delivered to the server'); });
}
setInterval(function () { flushOutbox(false); }, 30000);
window.addEventListener('online', function () { flushOutbox(false); });

function fetchResult(st) {
  api('getResult', { attemptId: st.attemptId, key: st.key }).then(function (r) {
    store.del('exam');
    if (r.result) { store.set('lastResult', r.result); showResult(r.result); } else go('#/');
  }).catch(function (e) { errorView(e); });
}

addRoute(/^\/result$/, function () {

function showResult(r, preview) {
  setScene(r.showScore === false ? 'ocean' : r.pass ? 'valley' : 'ocean');
  if (location.hash !== '#/result' && !preview) history.replaceState(null, '', '#/result');

  if (r.showScore !== false) {

    rows.push(['Wrong answers', '<b class="c-bad">' + r.wrong + '</b>']);
    rows.push(['Unanswered', r.unanswered]);

    rows.push(['Final marks', '<b>' + r.final + ' / ' + r.max + '</b>']);
    rows.push(['Final percentage', '<b>' + r.percent + '%</b>']);
    rows.push(['Pass mark', r.passMode === 'marks' ? r.passValue + ' marks' : r.passValue + '%']);
  } else rows.push(['Answered', r.answered]);
  rows.push(['Time taken', fmtDur(r.timeTakenSec)]);
  rows.push(['Submitted', fmtDate(r.submittedAt) + (r.mode === 'auto' || r.mode === 'timeout' ? ' (automatic, time over)' : '')]);
  var verdict = r.showScore === false ? '<div class="verdict pend">Submitted successfully</div><p class="muted center">Your result will be shared by the administrator.</p>' :
    '<div class="verdict ' + (r.pass ? 'pass' : 'fail') + '">' + (r.pass ? 'PASS' : 'FAIL') + '</div><div class="score">' + r.final + ' <small>/ ' + r.max + '</small> &middot; ' + r.percent + '%</div>';
  var rev = '';
  if (r.review && r.review.length) {
    rev = '<div class="card"><h2>Answer review</h2><p class="muted">' + (r.review.some(function (x) { return x.status === 'c'; }) ? 'All questions' : 'Wrong and unanswered questions') + ' with the correct answers' + '.</p>' +
      r.review.map(function (q) {
        var st = q.status === 'c' ? '<span class="tag ok">Correct</span>' : q.status === 'p' ? '<span class="tag part">Partly correct</span>' : q.status === 'w' ? '<span class="tag bad">Wrong</span>' : '<span class="tag">Not answered</span>';
        return '<div class="rv"><div class="rvh"><b>Q' + q.n + '.</b> ' + st + '</div><div class="qtext">' + nl2br(q.text) + '</div><ul class="rvo">' +
          q.options.map(function (o, i) {
            var c = q.correct.indexOf(o.k) >= 0, y = q.yours.indexOf(o.k) >= 0;
            return '<li class="' + (c ? 'right' : '') + (y && !c ? ' wrongpick' : '') + '"><span class="ol">' + letter(i) + '</span> ' + nl2br(o.t) + (c ? ' <b class="c-ok">&#10004; correct</b>' : '') + (y ? ' <i>(your answer)</i>' : '') + '</li>';
          }).join('') + '</ul>' + (q.explanation ? '<div class="expl"><b>Explanation:</b> ' + nl2br(q.explanation) + '</div>' : '') + '</div>';
      }).join('') + '</div>';
  }
  $app.innerHTML = header() + '<main class="wrap narrow result">' + (preview ? '<div class="card notice">Preview result (not saved). <a href="#" id="backEd">Back to the quiz editor</a></div>' : '') +
    '<div class="card"><div class="eyebrow">Result</div><h1 class="h1">' + esc(r.quizTitle) + '</h1>' + verdict +
    (r.emailStatus ? '<div class="ok-box mt-s">&#9993; ' + (r.emailStatus === 'sent' ? 'Your answer sheet with score, correct answers and explanations has been e-mailed to <b>' + esc(r.email) + '</b>.' : 'Your answer sheet will be e-mailed to <b>' + esc(r.email) + '</b> shortly.') + ' Check the spam folder if it does not arrive.</div>' : '') +
    '<table class="kv big">' + rows.map(function (x) { return '<tr><td>' + x[0] + '</td><td>' + x[1] + '</td></tr>'; }).join('') + '</table>' +
    '<div class="row gap mt noprint"><button class="btn primary" id="prt">Print / Save PDF</button><a class="btn ghost" href="#/">Home</a></div></div>' + rev + '</main>' + footer();
  qs('#prt').onclick = function () { printPage('Result_' + (r.mobile || r.cid || '').replace(/[^0-9A-Za-z]/g, '') + '_' + (r.code || '')); };
  if (qs('#backEd')) qs('#backEd').onclick = function (e) { e.preventDefault(); history.back(); };
}

/* ---------- preview (admin, local only; same rules as the server) ---------- */
function shuffleArr(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function startPreview(quiz) {
  var s = quiz.settings, bank = quiz.questions.filter(function (q) { return q.text; });
  if (!bank.length) { toast('Add questions first', 'err'); return; }
  var ids = bank.map(function (q, i) { return i; });
  var take = s.numQuestions > 0 && s.numQuestions < ids.length ? s.numQuestions : ids.length;
  var pick = take < ids.length ? shuffleArr(ids.slice()).slice(0, take) : ids.slice();
  if (take < ids.length && !s.shuffleQuestions) pick.sort(function (a, b) { return a - b; });
  if (take >= ids.length && s.shuffleQuestions) shuffleArr(pick);
  var questions = pick.map(function (bi, n) {
    var q = bank[bi], perm = q.options.map(function (x, k) { return k; });
    if (s.shuffleOptions) shuffleArr(perm);
    return { n: n + 1, id: 'p' + bi, bi: bi, text: q.text, type: q.type, marks: q.marks, options: perm.filter(function (k) { return String(q.options[k] || '').trim(); }).map(function (k) { return { k: k, t: q.options[k] }; }) };
  });
  var now = Date.now();
  EX = {
    preview: true, quiz: quiz, attemptId: 'preview', answers: {}, review: [], visited: {}, current: 0, offset: 0,
    p: { quiz: { title: quiz.title || 'Untitled quiz', code: quiz.code || 'PREVIEW', duration: s.duration, allowNav: s.allowNav, autoSubmit: s.autoSubmit, negative: s.negative, negWrong: s.negWrong, negUnanswered: s.negUnanswered, marksCorrect: s.marksCorrect },
      candidate: { name: 'Preview candidate', cid: 'ADMIN', mobile: 'preview' }, questions: questions, startedAt: now, deadline: s.duration > 0 ? now + s.duration * 60000 : 0 }
  };
  history.pushState(null, '', '#/preview');
  renderExam();
}
addRoute(/^\/preview$/, function () { if (EX && EX.preview && !EX.submitted) renderExam(); else history.back(); });

function previewGrade(ex) {
  var s = ex.quiz.settings, bank = ex.quiz.questions, g = { total: 0, answered: 0, correct: 0, partial: 0, wrong: 0, unanswered: 0, gross: 0, negative: 0, max: 0 }, review = [];
  ex.p.questions.forEach(function (pq, i) {
    var q = bank[pq.bi], m = q.marks !== '' && q.marks != null && isFinite(Number(q.marks)) ? Number(q.marks) : Number(s.marksCorrect);
    g.total++; g.max += m;
    var ch = (ex.answers[pq.id] || []).slice().sort(), cor = q.correct.slice().sort(), st;
    if (!ch.length) { st = 'u'; g.unanswered++; if (s.negative) g.negative += Number(s.negUnanswered) || 0; }
    else {
      g.answered++;
      var frac = 0;
      if (ch.length === cor.length && ch.every(function (x, k) { return x === cor[k]; })) { st = 'c'; g.correct++; g.gross += m; }
      else if (s.multiScoring === 'partial' && q.type === 'multi' && cor.length && (frac = Math.max(0, (ch.filter(function (x) { return cor.indexOf(x) >= 0; }).length - ch.filter(function (x) { return cor.indexOf(x) < 0; }).length) / cor.length)) > 0) { st = 'p'; g.partial++; g.gross += m * frac; }
      else { st = 'w'; g.wrong++; if (s.negative) g.negative += Number(s.negWrong) || 0; }
    }
    review.push({ n: i + 1, text: q.text, status: st, options: pq.options, yours: ch, correct: q.correct, explanation: q.explanation });
  });
  var fin = r2(g.gross - g.negative); if (s.floorZero && fin < 0) fin = 0;
  var pct = g.max ? r2(fin / g.max * 100) : 0;
  return Object.assign(g, { gross: r2(g.gross), negative: r2(g.negative), max: r2(g.max), final: fin, percent: pct, pass: s.passMode === 'marks' ? fin >= s.passValue : pct >= s.passValue, passMode: s.passMode, passValue: s.passValue,
    name: 'Preview candidate', cid: 'ADMIN', mobile: 'preview', quizTitle: ex.p.quiz.title, code: ex.p.quiz.code, timeTakenSec: Math.round((Date.now() - ex.p.startedAt) / 1000), submittedAt: Date.now(), mode: 'manual', showScore: true,
    review: s.showReview ? review.filter(function (x) { return s.reviewAll || x.status !== 'c'; }) : [] });
}

addRoute(/^\/admin$/, function () {

function loadED(q) {
  ED = { id: q.id, title: q.title, settings: Object.assign({}, DEF_SETTINGS, q.settings), questions: (q.questions || []).map(function (x) { return Object.assign({ marks: '' }, x); }), qcount: q.qcount, canKeys: q.questions !== null,

}

function examQCount() { var n = ED.questions.length, k = ED.settings.numQuestions; return k > 0 ? Math.min(k, n || k) : n; }

  if (!hasOwn || ED.settings.numQuestions > 0 && ED.settings.numQuestions < ED.questions.length) return { v: r2(n * mc), exact: !hasOwn };
