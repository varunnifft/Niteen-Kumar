  el.innerHTML = '<div class="card upl"><div class="rowb"><div><h3>Upload question bank</h3><p class="muted small">PDF, DOC, DOCX, XLS, XLSX, CSV, TXT or a photo / scan. Questions, options, correct answers and explanations are found automatically wherever they are written: after each question, in an answer-key table, in an "answers with explanation" section, or marked with &#10004; / * / bold. If answers are in a separate file, use <b>Scan answer sheet</b>.</p></div>' +
    '<div class="row gap wrapr"><label class="btn primary">Upload questions<input type="file" id="file" hidden accept="' + ACCEPT + '"></label>' +
    '<label class="btn ok" title="Read answers and explanations from an answer key / answer sheet in any format and fill them in automatically">Scan answer sheet<input type="file" id="akey" hidden accept="' + ACCEPT + '"></label>' +
    '<button class="btn aibtn" id="aiBtn">&#10024; Create quiz with AI</button>' +
    '<button class="btn ghost" id="paste">Paste text</button><button class="btn ghost" id="tpl">Excel template</button><button class="btn ghost" id="fmt">Accepted formats</button></div></div><div id="upst"></div></div>' +
    '<div class="rowb mt"><div class="row gap"><b>' + ED.questions.length + ' questions</b>' + (probs ? '<span class="tag bad">' + probs + ' need attention</span>' : ED.questions.length ? '<span class="tag ok">all complete</span>' : '') +
    '<select class="inp sm" id="flt"><option value="all">Show all</option><option value="bad" ' + (qFilter === 'bad' ? 'selected' : '') + '>Only problems</option></select></div>' +
    '<div class="row gap wrapr"><button class="btn ghost sm" id="addQ">+ Single answer</button><button class="btn ghost sm" id="addM">+ Multiple answer</button><button class="btn ghost sm" id="addTF">+ True / False</button>' + (ED.questions.length ? '<button class="btn dangerl sm" id="delAll">Delete all</button>' : '') + '</div></div>' +
    '<div id="qlist"></div><div class="center mt"><button class="btn ghost" id="addQ2">+ Add question</button></div>';
  qs('#file').onchange = function () { var f = this.files[0]; this.value = ''; if (f) importFile(f); };
  qs('#akey').onchange = function () { var f = this.files[0]; this.value = ''; if (f) importAnswerSheet(f); };
  qs('#aiBtn').onclick = function () { aiDialog(); };
  if (window.NK_OPEN_AI) { window.NK_OPEN_AI = false; setTimeout(function () { aiDialog(); }, 50); }
  var noAns = ED.questions.filter(function (q) { return !q.correct.length; }).length;
  if (noAns) { var nb = document.createElement('div'); nb.className = 'warn-box mt'; nb.innerHTML = '<b>' + noAns + ' question' + (noAns > 1 ? 's have' : ' has') + ' no correct answer.</b> If the answers are in another file or on a printed answer sheet, scan or upload it with <b>Scan answer sheet</b> and they will be filled in automatically. <label class="btn sm ok">Scan answer sheet<input type="file" id="akey2" hidden accept="' + ACCEPT + '"></label>'; qs('.upl').appendChild(nb); qs('#akey2').onchange = function () { var f = this.files[0]; this.value = ''; if (f) importAnswerSheet(f); }; }
  qs('#paste').onclick = pasteDialog;
  qs('#tpl').onclick = downloadTemplate;
  qs('#fmt').onclick = formatsHelp;
  qs('#flt').onchange = function () { qFilter = this.value; renderQList(); };
  function addQ(type, opts) { ED.questions.push({ id: uid('q'), text: '', type: type, options: opts, correct: [], explanation: '', marks: '' }); markDirty(); renderQList(); var c = qsa('.qed'); if (c.length) { c[c.length - 1].scrollIntoView({ behavior: 'smooth' }); qs('textarea', c[c.length - 1]).focus(); } }
  qs('#addQ').onclick = qs('#addQ2').onclick = function () { addQ('single', ['', '', '', '']); };
  qs('#addM').onclick = function () { addQ('multi', ['', '', '', '', '']); };
  qs('#addTF').onclick = function () { addQ('single', ['True', 'False']); };
  if (qs('#delAll')) qs('#delAll').onclick = function () { confirmBox('Delete all questions?', '<p>All ' + ED.questions.length + ' questions will be removed from this quiz (after you press Save).</p>', 'Delete all', true).then(function (y) { if (y) { ED.questions = []; markDirty(); renderEditor('questions'); } }); };
  renderQList();
}

function renderQList() {
  var box = qs('#qlist'); if (!box) return;
  var html = ED.questions.map(function (q, i) {
    var pr = QParse.problems(q);
    if (qFilter === 'bad' && !pr.length) return '';
    var multi = q.type === 'multi';
    var opts = q.options.map(function (o, k) {
      var on = q.correct.indexOf(k) >= 0;
      return '<div class="oed ' + (on ? 'on' : '') + '"><label class="cor" title="Correct answer"><input type="' + (multi ? 'checkbox' : 'radio') + '" name="c' + i + '" data-c="' + k + '" ' + (on ? 'checked' : '') + '><span>' + letter(k) + '</span></label>' +
        '<input class="inp" data-o="' + k + '" value="' + esc(o) + '" placeholder="Option ' + letter(k) + '"><button class="x" data-ro="' + k + '" title="Remove option">&times;</button></div>';
    }).join('');
    return '<div class="qed ' + (pr.length ? 'bad' : '') + '" data-i="' + i + '"><div class="qedh"><b>Q' + (i + 1) + '</b>' +
      '<select class="inp sm" data-type><option value="single" ' + (!multi ? 'selected' : '') + '>Single answer</option><option value="multi" ' + (multi ? 'selected' : '') + '>Multiple correct answers</option></select>' +
      '<label class="small">Marks <input class="inp xs" type="number" min="0" step="0.25" data-marks value="' + esc(q.marks) + '" placeholder="' + ED.settings.marksCorrect + '"></label>' +
      '<span class="sp"></span><button class="btn xs ghost" data-up ' + (i === 0 ? 'disabled' : '') + '>&uarr;</button><button class="btn xs ghost" data-down ' + (i === ED.questions.length - 1 ? 'disabled' : '') + '>&darr;</button><button class="btn xs ghost" data-dupq>Copy</button><button class="btn xs dangerl" data-delq>Delete</button></div>' +
      '<textarea class="inp" rows="2" data-text placeholder="Question text">' + esc(q.text) + '</textarea>' +
      '<div class="opts-ed">' + opts + '</div><button class="btn xs ghost" data-addo ' + (q.options.length >= 8 ? 'disabled' : '') + '>+ Option</button> <span class="muted small">Tick the correct answer' + (multi ? 's' : '') + '.</span>' +
      '<textarea class="inp mt-s" rows="2" data-exp placeholder="Explanation (shown in answer review)">' + esc(q.explanation) + '</textarea>' +
      (pr.length ? '<div class="probs">' + pr.map(esc).join(' &middot; ') + '</div>' : '') + '</div>';
  }).join('');
  box.innerHTML = html || '<div class="empty">' + (ED.questions.length ? 'No problems found.' : 'No questions yet. Upload a question bank or add questions.') + '</div>';
  qsa('.qed', box).forEach(function (card) {
    var i = Number(card.dataset.i), q = ED.questions[i];
    function fix() { var pr = QParse.problems(q), pb = qs('.probs', card); card.classList.toggle('bad', !!pr.length); if (pr.length) { if (!pb) { pb = document.createElement('div'); pb.className = 'probs'; card.appendChild(pb); } pb.innerHTML = pr.map(esc).join(' &middot; '); } else if (pb) pb.remove(); markDirty(); }
    qs('[data-text]', card).oninput = function () { q.text = this.value; fix(); };
    qs('[data-exp]', card).oninput = function () { q.explanation = this.value; markDirty(); };
    qs('[data-marks]', card).oninput = function () { q.marks = this.value === '' ? '' : Number(this.value); markDirty(); };
    qs('[data-type]', card).onchange = function () { q.type = this.value; if (q.type === 'single' && q.correct.length > 1) q.correct = q.correct.slice(0, 1); markDirty(); renderQList(); };
    qsa('[data-o]', card).forEach(function (inp) { inp.oninput = function () { q.options[Number(inp.dataset.o)] = inp.value; fix(); }; });
    qsa('[data-c]', card).forEach(function (c) {
      c.onchange = function () {
        var k = Number(c.dataset.c);
        if (q.type === 'multi') { if (c.checked) { if (q.correct.indexOf(k) < 0) q.correct.push(k); } else q.correct = q.correct.filter(function (x) { return x !== k; }); q.correct.sort(); }
        else q.correct = [k];
        qsa('.oed', card).forEach(function (o, n) { o.classList.toggle('on', q.correct.indexOf(n) >= 0); });
        fix();
      };
    });
    qsa('[data-ro]', card).forEach(function (b) {
      b.onclick = function () {
        var k = Number(b.dataset.ro); if (q.options.length <= 2) { toast('A question needs at least 2 options', 'err'); return; }
        q.options.splice(k, 1); q.correct = q.correct.filter(function (x) { return x !== k; }).map(function (x) { return x > k ? x - 1 : x; }); markDirty(); renderQList();
      };
    });
    qs('[data-addo]', card).onclick = function () { q.options.push(''); markDirty(); renderQList(); };
    qs('[data-up]', card).onclick = function () { ED.questions.splice(i - 1, 0, ED.questions.splice(i, 1)[0]); markDirty(); renderQList(); };
    qs('[data-down]', card).onclick = function () { ED.questions.splice(i + 1, 0, ED.questions.splice(i, 1)[0]); markDirty(); renderQList(); };
    qs('[data-dupq]', card).onclick = function () { var c = JSON.parse(JSON.stringify(q)); c.id = uid('q'); ED.questions.splice(i + 1, 0, c); markDirty(); renderQList(); };
    qs('[data-delq]', card).onclick = function () { ED.questions.splice(i, 1); markDirty(); renderQList(); toast('Question deleted (press Save to keep the change)'); };
  });
  var tab = qs('.tabs a.on'); if (tab && /questions/.test(tab.href)) { var probs = ED.questions.filter(function (q) { return QParse.problems(q).length; }).length; tab.innerHTML = 'Questions (' + ED.questions.length + ')' + (probs ? ' <span class="dot">' + probs + '</span>' : ''); }
}

function importFile(f) {
  var st = qs('#upst');
  st.innerHTML = '<div class="prog-msg"><span class="spin"></span> <span id="upmsg">Reading ' + esc(f.name) + '...</span></div>';
  extractQuestions(f, function (m) { var e = qs('#upmsg'); if (e) e.textContent = m; }).then(function (r) {
    st.innerHTML = '';
    reviewImport(r.questions, f.name, r.method, f);
  }).catch(function (e) {
    st.innerHTML = '<div class="err-box">Could not read ' + esc(f.name) + ': ' + esc(e.message) + '</div>';
  });
}

var ACCEPT = '.pdf,.doc,.docx,.xls,.xlsx,.xlsm,.ods,.csv,.txt,.rtf,.odt,.jpg,.jpeg,.png,.webp,.heic,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv,text/plain,image/*';

function importAnswerSheet(f) {
  if (!ED.questions.length) { toast('Upload the questions first, then scan the answer sheet', 'err'); return; }
  var st = qs('#upst');
  st.innerHTML = '<div class="prog-msg"><span class="spin"></span> <span id="upmsg">Scanning ' + esc(f.name) + ' for answers...</span></div>';
  extractAnswerSheet(f, function (m) { var e = qs('#upmsg'); if (e) e.textContent = m; }).then(function (r) {
    st.innerHTML = '';
    var sh = r.sheet, nKeys = Object.keys(sh.answers).length;
    if (!nKeys) { modal('<h3>No answers found</h3><div class="mbody"><p>No answers could be read from <b>' + esc(f.name) + '</b> (' + esc(r.method) + ').</p><p class="muted">Answers are recognised as "1 B", "1. (B) ...", "Q1: B", "Ans: B", answer-key tables, or questions marked with &#10004; / *. For a photo, make sure the page is sharp and well lit.</p></div><div class="mfoot"><button class="btn primary" data-close>OK</button></div>'); return; }
    var missing = ED.questions.filter(function (q) { return !q.correct.length; }).length;
    var test = JSON.parse(JSON.stringify(ED.questions)), res = QParse.applyAnswerSheet(test, sh, true);
    var prev = test.slice(0, 80).map(function (q, i) { var o = ED.questions[i], ch = o.correct.join() !== q.correct.join(); return '<li class="' + (ch ? 'chg' : '') + '"><b>Q' + (i + 1) + '</b> ' + esc(q.text.slice(0, 70)) + ' &rarr; <b>' + (q.correct.length ? q.correct.map(letter).join(', ') : '<span class="c-bad">no answer</span>') + '</b>' + (o.correct.length && ch ? ' <span class="muted">(was ' + o.correct.map(letter).join(', ') + ')</span>' : '') + (q.explanation && q.explanation !== o.explanation ? ' <span class="tag ok">explanation</span>' : '') + '</li>'; }).join('');
    var m = modal('<h3>Answer sheet read: ' + nKeys + ' answers</h3><div class="mbody"><p>From <b>' + esc(f.name) + '</b> &middot; ' + esc(r.method) + '. Matched to ' + res.answers + ' of ' + ED.questions.length + ' questions by question number' + (res.explanations ? ', ' + res.explanations + ' explanations' : '') + '. ' + (missing ? '<b>' + missing + '</b> questions currently have no answer.' : '') + '</p><ol class="implist">' + prev + '</ol></div>' +
      '<div class="mfoot"><button class="btn ghost" data-close>Cancel</button><button class="btn ghost" id="fillAll">Replace all answers</button><button class="btn primary" id="fillMiss">Fill missing answers &amp; explanations</button></div>', { wide: true });
    function go2(over) { var rr = QParse.applyAnswerSheet(ED.questions, sh, over); markDirty(); m.close(); renderEditor('questions'); toast(rr.answers + ' answers and ' + rr.explanations + ' explanations filled. Press Save.'); }
    qs('#fillMiss', m.el).onclick = function () { go2(false); };
    qs('#fillAll', m.el).onclick = function () { go2(true); };
  }).catch(function (e) { st.innerHTML = '<div class="err-box">Could not read ' + esc(f.name) + ': ' + esc(e.message) + '</div>'; });
}

function reviewImport(list, name, method, file) {
  list.forEach(function (q) { q.id = uid('q'); });
  var bad = list.filter(function (q) { return QParse.problems(q).length; }).length;
  if (!list.length) {
    var nm = modal('<h3>No questions found</h3><div class="mbody"><p>No questions could be recognised in <b>' + esc(name) + '</b>' + (method ? ' (' + esc(method) + ')' : '') + '.</p><p class="muted">Try <b>Smart scan with AI</b>, which reads any layout, or <b>Create new questions</b> from this document.</p></div><div class="mfoot"><button class="btn ghost" id="fh">Accepted formats</button>' + (file ? '<button class="btn aibtn" id="aisc">&#10024; Smart scan / create with AI</button>' : '') + '<button class="btn primary" data-close>OK</button></div>');
    if (qs('#aisc')) qs('#aisc').onclick = function () { nm.close(); aiDialog({ mode: 'extract', file: file }); };
    var b = qs('#fh'); if (b) b.onclick = function () { qs('.modal-bg').remove(); formatsHelp(); };
    return;
  }
  var prev = list.slice(0, 60).map(function (q, i) {
    var pr = QParse.problems(q);
    return '<li class="' + (pr.length ? 'bad' : '') + '"><b>' + (i + 1) + '.</b> ' + esc(q.text.slice(0, 160)) + '<div class="small muted">' + q.options.length + ' options &middot; answer: ' + (q.correct.length ? q.correct.map(letter).join(', ') : '<b class="c-bad">missing</b>') + (q.explanation ? ' &middot; explanation' : '') + (q.type === 'multi' ? ' &middot; multiple correct' : '') + (pr.length ? ' &middot; <span class="c-bad">' + esc(pr.join('; ')) + '</span>' : '') + '</div></li>';
  }).join('');
  var m = modal('<h3>Extracted ' + list.length + ' questions</h3><div class="mbody"><p>From <b>' + esc(name) + '</b>' + (method ? ' &middot; ' + esc(method) : '') + '. ' + (list.length - bad) + ' complete' + (bad ? ', <b class="c-bad">' + bad + ' need attention</b> (you can correct them after adding)' : '') + '.</p>' +
    (list.some(function (q) { return !q.correct.length; }) ? '<div class="warn-box">' + list.filter(function (q) { return !q.correct.length; }).length + ' questions have no answer in this file. After adding them, use <b>Scan answer sheet</b> to fill answers from a separate answer key or a photo of it.</div>' : '') +
    '<ol class="implist">' + prev + '</ol>' + (list.length > 60 ? '<p class="muted small">... and ' + (list.length - 60) + ' more</p>' : '') + '</div>' +
    '<div class="mfoot"><button class="btn ghost" data-close>Cancel</button>' + (file && bad ? '<button class="btn aibtn" id="aisc2">&#10024; Smart scan with AI</button>' : '') + (ED.questions.length ? '<button class="btn ghost" id="rep">Replace existing ' + ED.questions.length + '</button>' : '') + '<button class="btn primary" id="add">' + (ED.questions.length ? 'Add to existing' : 'Add questions') + '</button></div>', { wide: true });
  function apply(replace) {
    ED.questions = replace ? list : ED.questions.concat(list); markDirty(); m.close();
    qFilter = bad ? 'all' : qFilter; renderEditor('questions');
    toast(list.length + ' questions added. Review them and press Save.');
  }
  qs('#add', m.el).onclick = function () { apply(false); };
  if (qs('#aisc2', m.el)) qs('#aisc2', m.el).onclick = function () { m.close(); aiDialog({ mode: 'extract', file: file }); };
  if (qs('#rep', m.el)) qs('#rep', m.el).onclick = function () { apply(true); };
}

function pasteDialog() {
  var m = modal('<h3>Paste questions</h3><div class="mbody"><p class="muted small">Paste text copied from Word, PDF or a website. Example:<br><code>1. Question text<br>A) option &nbsp; B) option &nbsp; C) option &nbsp; D) option<br>Answer: B<br>Explanation: ...</code></p><textarea class="inp" id="ptxt" rows="14"></textarea></div><div class="mfoot"><button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="pgo">Extract questions</button></div>', { wide: true });
  qs('#pgo', m.el).onclick = function () { var t = qs('#ptxt', m.el).value; m.close(); reviewImport(QParse.fromText(t), 'pasted text', 'text'); };
}

function formatsHelp() {
  modal('<h3>Accepted question bank formats</h3><div class="mbody help">' +
    '<h4>Excel / CSV (most reliable)</h4><p>One question per row with a header row. Recognised columns: <code>Question</code>, <code>Option A</code> ... <code>Option H</code> (or <code>A</code>, <code>Option 1</code>...), <code>Correct Answer</code> (A, B, "A, C" for multiple, or the option text), <code>Explanation</code>, optional <code>Type</code> (single / multi) and <code>Marks</code>. All sheets are read.</p>' +
    '<h4>Word / PDF / text</h4><pre>1. Which gas is toxic?\nA) Carbon monoxide\nB) Nitrogen\nC) Argon\nD) Helium\nAnswer: A\nExplanation: CO binds to haemoglobin.</pre>' +
    '<ul><li>Questions: <code>1.</code> <code>1)</code> <code>Q1.</code> <code>Question 1:</code>, or Word auto-numbering</li><li>Options: <code>A)</code> <code>(a)</code> <code>a.</code> <code>Option A:</code> or numbered <code>1)</code> under <code>Q1</code>; options may be on one line</li><li>Answer: <code>Answer:</code> <code>Ans:</code> <code>Correct answer -</code> <code>Key:</code>; or mark the option with <code>*</code> / &#10004;; or a bold option in Word; or an <code>Answer Key</code> section at the end (<code>1. B  2. C</code>)</li><li>Explanation: <code>Explanation:</code> <code>Reason:</code> <code>Solution:</code></li><li>Multiple correct: <code>Answer: A, C</code></li><li>Word tables with the Excel columns above also work</li><li>Scanned PDFs and old .DOC files are converted on the server (Google Drive OCR)</li></ul></div><div class="mfoot"><button class="btn primary" data-close>OK</button></div>', { wide: true });
}

function downloadTemplate() {
  var rows = templateRows();
  if (!CAN_DOWNLOAD) {
    shareText('Question bank template (CSV)', rows.map(function (r) { return r.map(function (v) { v = String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\n'));
    toast('Template shared as CSV text. Save it and open in Excel.'); return;
  }
  lib('xlsx').then(function (X) {
    var wb = X.utils.book_new(), ws = X.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{ wch: 6 }, { wch: 50 }, { wch: 22 }, { wch: 22 }, { wch: 22 }, { wch: 22 }, { wch: 14 }, { wch: 14 }, { wch: 45 }, { wch: 8 }, { wch: 7 }];
    X.utils.book_append_sheet(wb, ws, 'Questions');
    X.writeFile(wb, 'Question_Bank_Template.xlsx');
  }).catch(function (e) { toast(e.message, 'err'); });
}

/* ----- preview tab ----- */
function previewTab(el) {
  if (ED.canKeys === false) { el.innerHTML = '<div class="card"><p>Your role cannot open the question paper.</p></div>'; return; }
  var s = ED.settings, n = examQCount(), mm = maxMarks();
  var paper = ED.questions.map(function (q, i) {
    return '<div class="pp"><div><b>Q' + (i + 1) + '.</b> ' + nl2br(q.text) + (q.type === 'multi' ? ' <span class="tag">multiple correct</span>' : '') + (q.marks !== '' && q.marks != null ? ' <span class="tag">' + q.marks + ' marks</span>' : '') + '</div><ol class="ppo">' +
      q.options.map(function (o, k) { var c = q.correct.indexOf(k) >= 0; return '<li class="' + (c ? 'right' : '') + '"><span class="ol">' + letter(k) + '</span> ' + nl2br(o) + (c ? ' <b class="c-ok">&#10004;</b>' : '') + '</li>'; }).join('') + '</ol>' +
      (q.explanation ? '<div class="expl"><b>Explanation:</b> ' + nl2br(q.explanation) + '</div>' : '') + (QParse.problems(q).length ? '<div class="probs">' + QParse.problems(q).map(esc).join(' &middot; ') + '</div>' : '') + '</div>';
  }).join('');
  el.innerHTML = '<div class="card"><div class="rowb"><div><h3>Try the examination as a candidate</h3><p class="muted small">Runs with the current rules (' + n + ' questions, ' + (s.duration ? s.duration + ' min' : 'no time limit') + ', max ' + mm.v + ' marks' + (s.negative ? ', negative marking' : '') + '). Nothing is saved.</p></div><button class="btn primary" id="pv">Start preview</button></div></div>' +
    '<div class="card"><div class="rowb"><h3>Complete question paper with answer key</h3><button class="btn ghost sm" id="pprint">Print</button></div>' + (paper || '<p class="muted">No questions yet.</p>') + '</div>';
  qs('#pv').onclick = function () { startPreview({ title: ED.title, code: ED.code, settings: ED.settings, questions: ED.questions }); };
  qs('#pprint').onclick = function () { printPage('Question_Paper_' + (ED.code || 'draft')); };
}

/* ----- share tab ----- */
function shareTab(el) {
  if (ED.id === 'new') { el.innerHTML = '<div class="card"><p>Save the quiz first to get its examination code, link and QR code.</p></div>'; return; }
  // the app's own /exec server address is always the public link (the server may only know its owner-only /dev test link)
  var base = !IN_GAS && /\/exec$/.test(S.api) ? S.api : (ED.link ? ED.link.replace(/\?.*$/, '') : S.webUrl);
  var direct = base && /\/exec$/.test(base) ? base + '?code=' + encodeURIComponent(ED.code) : '';
  var link = examPageLink(ED.code, base && /\/exec$/.test(base) ? base : '') || direct;
  var st = ED.status;
  var ctl = [];
  if (can('quiz.publish')) {
    if (st === 'draft' || st === 'closed') ctl.push('<button class="btn ok" data-st="published">' + (st === 'closed' ? 'Re-open examination' : 'Publish examination') + '</button>');
    if (st === 'published') ctl.push('<button class="btn warnb" data-st="paused">Pause</button>');
    if (st === 'paused') ctl.push('<button class="btn ok" data-st="published">Resume</button>');
    if (st === 'published' || st === 'paused') ctl.push('<button class="btn ghost" data-st="closed">Close examination</button>');
    if (st !== 'draft') ctl.push('<button class="btn ghost" data-st="draft">Back to draft</button>');
  }

function drawQR(cv, text, caption) {
  var q;
  try { q = NKQR(text); } catch (e) { return; }
  caption = caption || [];
  var ctx = cv.getContext('2d'), n = q.count, quiet = 4, cap = caption.length * 22 + (caption.length ? 8 : 0);
  var size = cv.width, cell = Math.floor((size - 8) / (n + quiet * 2));
  cv.height = size + cap;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  var off = Math.floor((size - cell * n) / 2);
  ctx.fillStyle = '#0b1f33';
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.dark(r, c)) ctx.fillRect(off + c * cell, off + r * cell, cell, cell);
  ctx.textAlign = 'center';
  caption.forEach(function (line, i) {
    ctx.font = (i ? '600 15px' : 'bold 15px') + ' system-ui, sans-serif';
    var t = String(line); while (t.length > 4 && ctx.measureText(t).width > size - 16) t = t.slice(0, -2);
    if (t !== String(line)) t = t.slice(0, -1) + '\u2026';
    ctx.fillText(t, size / 2, size + 16 + i * 22);
  });
}

function filteredResults() {
  var f = { q: qs('#fs').value.trim().toLowerCase(), st: qs('#fst').value, pf: qs('#fpf').value, from: qs('#ffrom').value, to: qs('#fto').value };
  store.set('resFilter', f);
  var from = f.from ? new Date(f.from + 'T00:00:00').getTime() : 0, to = f.to ? new Date(f.to + 'T23:59:59').getTime() : 0;
  return RES.rows.filter(function (x) {
    if (f.st && x.status !== f.st && !(f.st === 'in-progress' && x.status === 'expired')) return false;
    if (f.pf === 'pass' && x.pass !== true) return false;
    if (f.pf === 'fail' && x.pass !== false) return false;
    var t = x.submittedAt || x.startedAt;
    if (from && t < from) return false;
    if (to && t > to) return false;
    if (f.q && (x.name + ' ' + x.cid + ' ' + x.mobile + ' ' + x.email + ' ' + x.empId + ' ' + x.dept + ' ' + x.attemptId + ' ' + x.quizTitle).toLowerCase().indexOf(f.q) < 0) return false;
    return true;
  });
}

    '<div class="tablewrap"><table class="tbl"><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th>Last login</th><th>Created</th><th></th></tr></thead><tbody>' +
    r.users.map(function (u) { return '<tr><td><b>' + esc(u.name) + '</b></td><td class="mono">' + esc(u.username) + '</td><td>' + esc(u.roleLabel) + '</td><td>' + (u.active ? '<span class="tag ok">active</span>' : '<span class="tag bad">disabled</span>') + '</td><td>' + fmtDate(u.lastLogin) + '</td><td>' + fmtDate(u.created) + (u.createdBy ? ' <span class="muted small">by ' + esc(u.createdBy) + '</span>' : '') + '</td><td><button class="btn xs" data-ed="' + esc(u.username) + '">Edit</button>' + (u.username !== S.user.username ? ' <button class="btn xs dangerl" data-del="' + esc(u.username) + '">Delete</button>' : '') + '</td></tr>'; }).join('') + '</tbody></table></div>');
  bindShell();
  qs('#addU').onclick = function () { userForm(null, r.roles); };
  qsa('[data-ed]').forEach(function (b) { b.onclick = function () { userForm(r.users.filter(function (u) { return u.username === b.dataset.ed; })[0], r.roles); }; });
  qsa('[data-del]').forEach(function (b) { b.onclick = function () { confirmBox('Delete user?', '<p>Delete <b>' + esc(b.dataset.del) + '</b>? They can no longer log in.</p>', 'Delete', true).then(function (y) { if (y) api('userDelete', { username: b.dataset.del }).then(function (r2_) { toast('User deleted'); drawUsers(r2_); }).catch(function (e) { toast(e.message, 'err'); }); }); }; });
}
function userForm(u, roles) {
  var isNew = !u; u = u || { username: '', name: '', role: 'examiner', active: true };
  var opts = Object.keys(roles).filter(function (k) { return k !== 'owner' || S.user.role === 'owner'; }).map(function (k) { return '<option value="' + k + '" ' + (u.role === k ? 'selected' : '') + '>' + esc(roles[k]) + '</option>'; }).join('');
  var m = modal('<h3>' + (isNew ? 'Add user' : 'Edit ' + esc(u.username)) + '</h3><div class="mbody">' +
    '<label class="lbl">Full name</label><input class="inp" id="un" value="' + esc(u.name) + '">' +
    '<label class="lbl">Username</label><input class="inp" id="uu" value="' + esc(u.username) + '" ' + (isNew ? '' : 'disabled') + ' autocapitalize="none">' +
    '<label class="lbl">Role</label><select class="inp" id="ur">' + opts + '</select>' +
    '<label class="lbl">' + (isNew ? 'Password (min. 6)' : 'New password (leave empty to keep)') + '</label><input class="inp" type="password" id="up">' +
    '<label class="chk mt"><input type="checkbox" id="ua" ' + (u.active ? 'checked' : '') + '> Account active</label></div>' +
    '<div class="mfoot"><button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="us">Save</button></div>');
  qs('#us', m.el).onclick = function () {
    var b = this; busy(b, true, 'Saving');
    api('userSave', { username: qs('#uu', m.el).value, name: qs('#un', m.el).value, role: qs('#ur', m.el).value, password: qs('#up', m.el).value, active: qs('#ua', m.el).checked }).then(function (r) { m.close(); toast('Saved'); drawUsers(r); }).catch(function (e) { busy(b, false); toast(e.message, 'err'); });
  };
}

/* ---------- audit log ---------- */
addRoute(/^\/admin\/audit$/, function () {
  if (needLogin()) return;
  loading('Loading audit log...');
  api('audit', { limit: 1000 }).then(function (r) {
    $app.innerHTML = adminShell('audit', '<div class="rowb"><h1 class="h1">Audit log</h1><input class="inp" id="af" placeholder="Filter (user, action, code...)"></div><div class="tablewrap"><table class="tbl" id="at"></table></div>');
    bindShell();
    function draw() {
      var f = qs('#af').value.toLowerCase();
      var rows = r.rows.filter(function (x) { return !f || (x.user + ' ' + x.action + ' ' + x.target + ' ' + x.details).toLowerCase().indexOf(f) >= 0; });
      qs('#at').innerHTML = '<thead><tr><th>Time</th><th>User</th><th>Action</th><th>Target</th><th>Details</th></tr></thead><tbody>' + rows.slice(0, 1000).map(function (x) { return '<tr><td>' + fmtDate(x.time) + '</td><td>' + esc(x.user) + '</td><td>' + esc(x.action) + '</td><td class="mono">' + esc(x.target) + '</td><td class="small">' + esc(String(x.details).slice(0, 300)) + '</td></tr>'; }).join('') + '</tbody>';
    }
    qs('#af').oninput = draw; draw();
  }).catch(function (e) { errorView(e); });
});

/* ---------- settings ---------- */
addRoute(/^\/admin\/settings$/, function () {
  if (needLogin()) return;
  loading('Loading settings...');
  api('settingsGet').then(function (r) {
    var s = r.settings, edit = can('settings.manage');
    if (r.webUrl) { S.webUrl = r.webUrl; store.set('webUrl', r.webUrl); }
    $app.innerHTML = adminShell('settings', '<h1 class="h1">Settings</h1><div class="grid2">' +
      '<div class="card"><h3>Results storage: Google Drive</h3>' +
      '<p class="muted small">Every submitted examination is saved automatically into this folder: one sub-folder and one results workbook per quiz (candidate details, marks, answers, time taken, PASS/FAIL). If Drive is unavailable, results are kept safely in the server database and retried every 10 minutes.</p>' +
      '<label class="lbl">Drive folder link (or a link to any file inside that folder)</label><div class="row gap nowrap"><input class="inp" id="dfold" placeholder="https://drive.google.com/drive/folders/..." value="' + esc(s.driveFolder) + '" ' + (edit ? '' : 'disabled') + '>' + (edit ? '<button class="btn" id="pfold">Paste</button>' : '') + '</div>' +
      (s.driveFolderId ? '<div class="ok-box mt-s">Connected: <b>' + esc(s.driveFolderName) + '</b>' + (s.driveAuto ? ' (created automatically)' : '') + ' <button class="btn xs ghost" id="ofold">Open</button></div>' : '<div class="warn-box mt-s">No folder set yet. Results are stored in the database and pushed to Drive when you set a folder.</div>') +
      '<div class="hint">Folder must be in, or shared as Editor with, the Google account running the server' + (r.owner ? ' (<b>' + esc(r.owner) + '</b>)' : '') + '. You can change it at any time; later results go to the new folder.</div>' +
      (edit ? '<div class="row gap mt"><button class="btn primary" id="sfold">Save &amp; test folder</button>' + (s.driveFolderId && !s.driveAuto ? '<button class="btn dangerl" id="rfold">Use automatic folder</button>' : '') + '</div>' : '') +
      '<div class="row gap mt"><span>Waiting for Drive: <b>' + r.pendingSync + '</b></span><button class="btn sm ghost" id="snow">Sync now</button></div></div>' +
      '<div class="card"><h3>Organisation</h3><label class="lbl">Name shown to candidates</label><input class="inp" id="org" value="' + esc(s.orgName) + '" ' + (edit ? '' : 'disabled') + '>' + (edit ? '<button class="btn mt" id="sorg">Save</button>' : '') +
      '<h3 class="mt2">Server</h3><table class="kv"><tr><td>Server version</td><td>' + esc(r.version) + '</td></tr><tr><td>App version</td><td>' + APP_VERSION + '</td></tr><tr><td>Running as</td><td>' + esc(r.owner || '-') + '</td></tr><tr><td>Web link</td><td class="mono small">' + esc(r.webUrl || 'not deployed') + '</td></tr></table>' +
      '<div class="row gap mt wrapr">' + (r.webUrl ? '<button class="btn sm ghost" id="cpw">Copy server link (for the Android app)</button>' : '') + '<button class="btn sm ghost" id="osys">Open private system folder</button>' + (IN_GAS ? '' : '<a class="btn sm ghost" href="#/server">Change server</a>') + '</div>' +
      '<h3 class="mt2">&#10024; AI question generator</h3><p class="muted small">Creates quizzes from any document or instruction and reads messy question papers (Smart scan). Uses Google Gemini with your own free API key: open <b>aistudio.google.com</b> &rarr; <i>Get API key</i> &rarr; <i>Create API key</i>, copy it and paste it here. The key is kept only on the server.</p>' +
      (s.aiConfigured ? '<div class="ok-box">AI is set up (model ' + esc(s.aiModel) + ').</div>' : '<div class="warn-box">Not set up yet.</div>') +
      (edit ? '<label class="lbl">Gemini API key</label><div class="row gap nowrap"><input class="inp" type="password" id="aikey" placeholder="' + (s.aiConfigured ? 'saved - paste a new key to replace' : 'paste the key') + '" autocomplete="off"><button class="btn" id="paik">Paste</button></div>' +
        '<label class="lbl">Model</label><input class="inp" id="aimodel" value="' + esc(s.aiModel) + '"><div class="hint">Leave as is unless Google renames its models.</div>' +
        '<div class="row gap mt"><button class="btn primary" id="saik">Save &amp; test AI</button>' + (s.aiConfigured ? '<button class="btn dangerl" id="raik">Remove key</button>' : '') + '</div>' : '') +
      '<h3 class="mt2">My account</h3><button class="btn sm" id="cpw2">Change my password</button></div></div>');
    bindShell();
    if (qs('#ofold')) qs('#ofold').onclick = function () { openExternal(s.driveFolderUrl); };
    if (qs('#osys')) qs('#osys').onclick = function () { openExternal(r.systemFolderUrl); };
    if (qs('#cpw')) qs('#cpw').onclick = function () { copyText(r.webUrl); };
    if (qs('#pfold')) qs('#pfold').onclick = function () { pasteInto(qs('#dfold')); };
    if (qs('#sfold')) qs('#sfold').onclick = function () { var b = this, v = qs('#dfold').value.trim(); if (!v) { toast('Paste the folder link first', 'err'); return; } busy(b, true, 'Testing'); api('settingsSave', { driveFolder: v }).then(function (x) { var sr = x.syncReport && x.syncReport.synced ? ' ' + x.syncReport.synced + ' waiting result(s) saved there now.' : ''; if (x.note) { modal('<h3>Drive folder set</h3><div class="mbody"><p>' + esc(x.note) + '</p><p>' + esc(sr) + '</p></div><div class="mfoot"><button class="btn primary" data-close>OK</button></div>', { onClose: function () { route(); } }); } else { toast('Results folder: ' + x.settings.driveFolderName + '.' + sr); route(); } }).catch(function (e) { busy(b, false); toast(e.message, 'err'); }); };
    if (qs('#rfold')) qs('#rfold').onclick = function () { var b = this; confirmBox('Use the automatic folder?', '<p>New results will be saved in the folder "NK Exam Portal - Results" in the server owner\'s Drive. Nothing already in Drive is deleted.</p>', 'Use automatic folder').then(function (y) { if (!y) return; busy(b, true, ''); api('settingsSave', { driveFolder: '' }).then(function (x) { toast('Using the automatic folder "' + x.settings.driveFolderName + '"'); route(); }).catch(function (e) { busy(b, false); toast(e.message, 'err'); }); }); };
    if (qs('#sorg')) qs('#sorg').onclick = function () { var b = this; busy(b, true, ''); api('settingsSave', { orgName: qs('#org').value }).then(function () { S.org = qs('#org').value; store.set('org', S.org); toast('Saved'); route(); }).catch(function (e) { busy(b, false); toast(e.message, 'err'); }); };
    qs('#snow').onclick = function () { var b = this; busy(b, true, 'Syncing'); api('syncNow').then(function (x) { var p = x.report; toast('Synced ' + p.synced + (p.failed ? ', failed ' + p.failed + ': ' + p.lastError : ''), p.failed ? 'err' : ''); route(); }).catch(function (e) { busy(b, false); toast(e.message, 'err'); }); };
    if (qs('#paik')) qs('#paik').onclick = function () { pasteInto(qs('#aikey')); };
    if (qs('#saik')) qs('#saik').onclick = function () {
      var b = this, body = { aiModel: qs('#aimodel').value.trim() }, k = qs('#aikey').value.trim();
      if (k) body.aiKey = k; else if (!s.aiConfigured) { toast('Paste the Gemini API key first', 'err'); return; }
      busy(b, true, 'Testing');
      api('settingsSave', body).then(function () { AI_INFO = null; return api('aiTest'); }).then(function (t) {
        modal('<h3>AI is working</h3><div class="mbody"><p>Model: <b>' + esc(t.model) + '</b></p>' + (t.sample ? '<p><b>Sample question:</b> ' + esc(t.sample.question) + '</p><ol type="A">' + (t.sample.options || []).map(function (o) { return '<li>' + esc(o) + '</li>'; }).join('') + '</ol>' : '') + '</div><div class="mfoot"><button class="btn primary" data-close>OK</button></div>', { onClose: function () { route(); } });
      }).catch(function (e) { busy(b, false); toast(e.message, 'err'); });
    };
    if (qs('#raik')) qs('#raik').onclick = function () { var b = this; busy(b, true, ''); api('settingsSave', { aiKey: '' }).then(function () { AI_INFO = null; toast('AI key removed'); route(); }).catch(function (e) { busy(b, false); toast(e.message, 'err'); }); };
    qs('#cpw2').onclick = function () {
      var m = modal('<h3>Change password</h3><div class="mbody"><label class="lbl">Current password</label><input class="inp" type="password" id="o"><label class="lbl">New password (min. 6)</label><input class="inp" type="password" id="n"><label class="lbl">Repeat new password</label><input class="inp" type="password" id="n2"></div><div class="mfoot"><button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="cs">Change</button></div>');
      qs('#cs', m.el).onclick = function () {
        if (qs('#n', m.el).value !== qs('#n2', m.el).value) { toast('New passwords do not match', 'err'); return; }
        api('changePassword', { oldPassword: qs('#o', m.el).value, newPassword: qs('#n', m.el).value }).then(function () { m.close(); toast('Password changed'); }).catch(function (e) { toast(e.message, 'err'); });
      };
    };
  }).catch(function (e) { errorView(e); });
});

/* ---------- change Google Drive results folder ---------- */
function driveFolderDialog(cur, done) {
  cur = cur || {};
  var m = modal('<h3>Google Drive results folder</h3><div class="mbody">' +
    (cur.driveFolderId ? '<div class="ok-box">Current folder: <b>' + esc(cur.driveFolderName || cur.driveFolderId) + '</b>' + (cur.driveAuto ? ' (created automatically in your Drive)' : '') + '</div>' : '<div class="warn-box">No folder set yet.</div>') +
    '<p class="small">1. Open Google Drive and open (or create) the folder for exam results.<br>2. Copy its link: <i>Share &rarr; Copy link</i>, or copy the address bar. A link to <b>any file inside the folder</b> (a sheet, doc or PDF) also works.<br>3. Paste it below and press <b>Save &amp; test</b>.</p>' +
    '<label class="lbl">Folder link (or a file link in that folder)</label><div class="row gap nowrap"><input class="inp" id="dlink" placeholder="https://drive.google.com/drive/folders/..." value="' + esc(cur.driveFolder || '') + '"><button class="btn" id="dpaste">Paste</button></div>' +
    '<div class="hint">New results go to the new folder from now on. Results already saved stay in the old folder; use <b>Sync to Drive</b> or <b>Save report to Drive</b> on the Results page to put a full report in the new folder.</div><div id="dmsg" class="mt-s"></div></div>' +
    '<div class="mfoot">' + (cur.driveFolderId && !cur.driveAuto ? '<button class="btn dangerl" id="dclear">Use automatic folder</button><span class="sp"></span>' : '') + '<button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="dsave">Save &amp; test</button></div>');
  var inp = qs('#dlink', m.el);
  qs('#dpaste', m.el).onclick = function () { pasteInto(inp); };
  function save(val, b) {
    busy(b, true, 'Testing');
    api('settingsSave', { driveFolder: val }).then(function (r) {
      m.close();
      var sr = r.syncReport && r.syncReport.synced ? ' ' + r.syncReport.synced + ' waiting result(s) saved there now.' : '';
      if (r.note) modal('<h3>Drive folder set</h3><div class="mbody"><p>' + esc(r.note) + '</p><p>' + esc(sr) + '</p></div><div class="mfoot"><button class="btn primary" data-close>OK</button></div>');
      else toast((val ? 'Results folder: "' + (r.settings.driveFolderName || 'folder') + '".' : 'Using the automatic folder "' + r.settings.driveFolderName + '".') + sr);
      if (done) done(r);
    }).catch(function (e) { busy(b, false); qs('#dmsg', m.el).innerHTML = '<div class="err-box">' + esc(e.message) + '</div>'; });
  }
  qs('#dsave', m.el).onclick = function () { var v = inp.value.trim(); if (!v) { toast('Paste the folder link first', 'err'); inp.focus(); return; } save(v, this); };
  if (qs('#dclear', m.el)) qs('#dclear', m.el).onclick = function () { save('', this); };
  setTimeout(function () { inp.focus(); }, 50);
}

/* ---------- start ---------- */
function boot() {
  $app = document.getElementById('app');
  window.addEventListener('hashchange', route);
  function startWith(code) {
    if (code && !/^#\/(join|exam|result)/.test(location.hash)) { location.hash = '#/join/' + code.toUpperCase(); }
    route();
    setTimeout(function () { flushOutbox(false); }, 3000);
  }
  if (IN_GAS && google.script.url) google.script.url.getLocation(function (loc) { startWith((loc.parameter || {}).code); });
  else {
    var sv = location.search.match(/[?&]srv=([^&]+)/), srv = sv ? extractServer(decodeURIComponent(sv[1])) : '';
    if (srv && srv !== S.api) { if (!serverList().some(function (x) { return x.url === srv; })) { var mine = store.get('servers', []); mine.push({ name: 'From exam link', url: srv }); store.set('servers', mine); } useServer(srv); }
    var m = location.search.match(/[?&]code=([A-Za-z0-9]+)/); startWith(m ? m[1] : '');
  }
}
document.addEventListener('DOMContentLoaded', boot);

</script>
